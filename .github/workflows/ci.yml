# Tests on macOS and Windows, then builds what people install: Crew.app for Apple Silicon and Intel (DMG + zip) and
# the Windows installers for x64 and arm64, kept as this run's artifacts. A v* tag also puts them in a draft release
# on the public repo, once that's configured (see "release" at the bottom).
#
# Signing turns on by itself when these secrets exist (electron-builder.config.mjs has the details); without them the
# Mac build is signed ad hoc and the Windows one is unsigned:
#   MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD        Developer ID Application certificate, .p12 as base64
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarization (.p8 contents)
#   WIN_CERTIFICATE, WIN_CERTIFICATE_PASSWORD        Authenticode .pfx as base64
#   or AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET + variables AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT,
#      AZURE_SIGN_PROFILE                            Azure Trusted Signing
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows: several desktop tests still assume a Unix shell (bin/ scripts, the terminal host's socket, paths) until
    # the Windows ports of those land. The job runs them all and lists what fails in its summary, without blocking.
    # Make it blocking once that list is empty.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: shared
        working-directory: shared
        run: npm test
      - name: install
        working-directory: desktop
        run: npm ci
      - name: desktop
        working-directory: desktop
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml test/*.test.js
      - name: what failed
        if: always()
        working-directory: desktop
        shell: bash
        run: '[ -f test-results.xml ] && node scripts/test-summary.mjs test-results.xml >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: desktop/test-results.xml
          if-no-files-found: ignore

  build-mac:
    runs-on: macos-latest
    env:
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # the dictation helper uses macOS 26's SpeechAnalyzer: it needs the macOS 26 SDK (and still runs on macOS 13+)
      - name: Xcode with the macOS 26 SDK
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          if [ "${sdk%%.*}" -lt 26 ]; then
            xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$xcode" ] || { echo "::error::this runner has no Xcode 26 (SDK $sdk)"; ls -d /Applications/Xcode*; exit 1; }
            sudo xcode-select -s "$xcode"
          fi
          xcrun --sdk macosx --show-sdk-version
      - name: install
        working-directory: desktop
        run: npm ci
      - name: notarization key
        if: env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: build
        working-directory: desktop
        run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      - name: check the app
        working-directory: desktop/release
        run: |
          for app in mac*/Crew.app; do
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags'
            test -x "$app/Contents/Resources/voice/crew-voice"
          done
          ls -l *.dmg *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: crew-mac
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # the speech model the dictation helper ships with, downloaded once (scripts/build-voice.mjs checks its hash)
      - uses: actions/cache@v4
        with:
          path: desktop/dist/voice/cache
          key: voice-model-${{ hashFiles('desktop/scripts/build-voice.mjs') }}
      - name: install
        working-directory: desktop
        run: npm ci
      - name: build
        working-directory: desktop
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
      # what a person does: install for this user only (no admin), then uninstall
      - name: install
        shell: pwsh
        working-directory: desktop
        run: |
          $setup = Get-ChildItem release/Crew-Setup-*-x64.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Crew"
          foreach ($f in 'Crew.exe', 'resources\app.asar', 'resources\app.asar.unpacked\bin\crew',
                         'resources\app.asar.unpacked\node_modules\node-pty\prebuilds\win32-x64\conpty\OpenConsole.exe',
                         'resources\voice\crew-voice.exe', 'resources\voice\models\ggml-base-q5_1.bin') {
            if (-not (Test-Path "$dir\$f")) { throw "the installed Crew has no $f" }
          }
          if (-not (Test-Path 'HKCU:\Software\Classes\.crew')) { Write-Output '::warning::.crew files are not associated with Crew' }
          "CREW_INSTALLED=$dir" >> $env:GITHUB_ENV
      - name: the installed dictation helper hears speech
        working-directory: desktop
        run: node native/windows/smoke.mjs "${{ env.CREW_INSTALLED }}\resources\voice\crew-voice.exe"
      - name: uninstall
        shell: pwsh
        run: |
          Start-Process "$env:CREW_INSTALLED\Uninstall Crew.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$env:CREW_INSTALLED\Crew.exe") { throw 'uninstalling left Crew.exe behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: crew-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error

  # A v* tag: a draft release with everything built, on the public repo named by the repository variable RELEASE_REPO
  # (owner/name), using the secret RELEASE_TOKEN (a token that can write to that repo's releases). Neither is set
  # yet, so this job is skipped until they are. The public repo needs at least one commit for the release's tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_REPO != ''
    needs: [test, build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          gh release create "$TAG" out/* --repo "$RELEASE_REPO" --draft --title "Crew ${TAG#v}" --notes "Crew ${TAG#v} for macOS (Apple Silicon and Intel) and Windows (x64 and Arm)."
