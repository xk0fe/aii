<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>Crew</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    .wrap { display: inline-flex; align-items: center; gap: 10px; padding: 20px; }
    /* Solid sheets, not glass: a transparent window can't blur the desktop behind it, so glass would let whatever
       is underneath (a terminal, a web page) show through the text. */
    .sheet { background: var(--panel); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .14), 0 12px 32px -14px rgba(0, 0, 0, .38), 0 3px 8px -4px rgba(0, 0, 0, .14); }
    @media (prefers-color-scheme: dark) {
      .sheet { box-shadow: 0 0 0 .5px rgba(0, 0, 0, .7), inset 0 0 0 .5px rgba(255, 255, 255, .1), 0 12px 32px -14px rgba(0, 0, 0, .7), 0 3px 8px -4px rgba(0, 0, 0, .4); }
    }

    .panel { display: none; width: 400px; height: 600px; border-radius: 20px; flex-direction: column; overflow: hidden; transform-origin: 100% 50%; }
    .open .panel { display: flex; animation: panel-in .38s var(--bounce); }
    @keyframes panel-in { from { opacity: 0; transform: translateX(14px) scale(.94); } }
    .panel header { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 14px; flex: none; -webkit-app-region: drag; }
    .panel header .brand { display: flex; align-items: center; gap: 7px; }
    .panel header .mark { width: 24px; height: 16px; color: var(--fg); }
    .panel header b { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .panel header .sums { margin-left: 4px; }
    .panel header button, .panel header .sums { -webkit-app-region: no-drag; }
    .panel header .icon { width: 30px; height: 30px; padding: 0; }
    .panel .feed { flex: 1; }
    .panel .compose { flex: none; }

    /* The pill: the crew as little creatures on the screen edge. */
    .pill { width: 52px; border-radius: 26px; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; -webkit-app-region: drag; transition: box-shadow .3s; }
    .home { -webkit-app-region: no-drag; width: 40px; height: 36px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 3px; border-radius: 14px; transition: background .15s, transform .3s var(--bounce); }
    .home:hover { background: var(--btn); }
    .home + .dots:not(:empty) { padding-top: 7px; border-top: 1px solid var(--line); width: 32px; }
    .home:active { transform: scale(.9); }
    .home svg { width: 100%; height: 100%; display: block; overflow: visible; }
    /* while anyone works, the three buddies hop in a little wave */
    .home path { transform-box: fill-box; transform-origin: 50% 100%; }
    .busy .home .m0, .busy .home .m1, .busy .home .m2 { animation: buddy-hop 1.1s cubic-bezier(.3, .6, .4, 1) infinite; }
    .busy .home .m1 { animation-delay: .14s; }
    .busy .home .m2 { animation-delay: .28s; }
    @keyframes buddy-hop { 0%, 55%, 100% { translate: 0 0; } 25% { translate: 0 -2.4px; } }
    /* someone needs you: a warm edge that breathes (their creature wiggles with a "!") */
    .alert .pill { animation: pill-alert 2s ease-in-out infinite; }
    @keyframes pill-alert { 50% { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--waiting) 75%, transparent), 0 0 0 5px color-mix(in srgb, var(--waiting) 16%, transparent), 0 12px 32px -14px rgba(0, 0, 0, .38); } }
    /* the crew lives in the pill: one little creature per agent, hopping while it works, magnified like the Dock */
    .dots { display: flex; flex-direction: column; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
    .dots .face { cursor: pointer; line-height: 0; transition: transform .3s var(--spring); transform-origin: 70% 50%; }
    .dots .face:hover { transform: scale(1.32); z-index: 1; }
    .dots .face:hover + .face, .dots .face:has(+ .face:hover) { transform: scale(1.12); }
    .dots .face:active { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel sheet">
      <header>
        <span class="brand"><span class="logo"></span><b>Crew</b></span><span class="sums"></span><span class="grow"></span>
        <button class="icon" data-act="dashboard" title="Open the dashboard" aria-label="Open the dashboard"></button>
        <button class="icon" data-act="close" title="Close (Esc)" aria-label="Close"></button>
      </header>
      <div class="feed"></div>
      <div class="compose"></div>
    </section>
    <aside class="pill sheet">
      <button class="home" title="Crew"></button>
      <div class="dots"></div>
    </aside>
  </div>
  <script src="avatar.js"></script>
  <script src="voice.js"></script>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
