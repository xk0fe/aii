<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>Crew</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    .wrap { display: inline-flex; align-items: center; gap: 8px; padding: 12px; }
    .glass { background: var(--glass); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3); }

    .panel { display: none; width: 390px; height: 580px; border-radius: 22px; flex-direction: column; overflow: hidden; }
    .open .panel { display: flex; }
    .panel header { display: flex; align-items: center; gap: 8px; padding: 12px 10px 10px 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .panel header b { font-size: 14px; }
    .panel header .sub { color: var(--fg2); font-size: 12px; }
    .panel header button { -webkit-app-region: no-drag; }
    .panel .feed { flex: 1; }

    .pill { width: 54px; border-radius: 27px; padding: 12px 0 13px; display: flex; flex-direction: column; align-items: center; gap: 11px; -webkit-app-region: drag; transition: box-shadow .3s, border-color .3s; }
    .home { -webkit-app-region: no-drag; width: 40px; height: 36px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 3px; border-radius: 14px; }
    .home:hover { background: var(--btn); }
    .home svg { width: 100%; height: 100%; display: block; overflow: visible; }
    /* while anyone works, the three buddies hop in a little wave */
    .home path { transform-box: fill-box; transform-origin: 50% 100%; }
    .busy .home .m0, .busy .home .m1, .busy .home .m2 { animation: buddy-hop 1.1s cubic-bezier(.3, .6, .4, 1) infinite; }
    .busy .home .m1 { animation-delay: .14s; }
    .busy .home .m2 { animation-delay: .28s; }
    @keyframes buddy-hop { 0%, 55%, 100% { translate: 0 0; } 25% { translate: 0 -2.4px; } }
    .alert .pill { border-color: rgba(255, 159, 10, 0.7); box-shadow: 0 0 0 3px rgba(255, 159, 10, 0.18), 0 8px 22px rgba(0, 0, 0, 0.35); }
    /* the crew lives in the pill: one little creature per agent, hopping while it works */
    .dots { display: flex; flex-direction: column; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
    .dots .face { cursor: pointer; line-height: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel glass">
      <header>
        <b>Crew</b><span class="sub"></span><span class="grow"></span>
        <button class="icon" data-act="dashboard" title="Open dashboard"></button>
        <button class="icon" data-act="close" title="Close (Esc)"></button>
      </header>
      <div class="feed"></div>
      <div class="compose"></div>
    </section>
    <aside class="pill glass">
      <button class="home" title="Crew"></button>
      <div class="dots"></div>
    </aside>
  </div>
  <script src="avatar.js"></script>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
