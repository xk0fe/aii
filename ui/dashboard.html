<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>Crew</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="collection.css">
  <style>
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    .titlebar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 86px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .titlebar .brand { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
    .titlebar .brand .mark { width: 27px; height: 18px; color: var(--fg); }
    .titlebar .brand b { font-size: 14.5px; font-weight: 750; letter-spacing: -.01em; }
    .titlebar button, .seg, .sums { -webkit-app-region: no-drag; }
    .titlebar .btn.add { display: inline-flex; align-items: center; gap: 4px; padding-left: 9px; }
    .titlebar .btn.add svg { width: 14px; height: 14px; }
    .titlebar .divider { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }

    main { display: grid; grid-template-columns: 272px minmax(0, 1fr) 390px; height: calc(100vh - 46px); }
    .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .side-head { display: flex; align-items: baseline; gap: 6px; padding: 14px 18px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
    .side-head span { letter-spacing: 0; text-transform: none; font-weight: 550; }
    .side .agents { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 1px; scrollbar-gutter: stable; }
    .side .agent.on { background: var(--btn-hover); }
    .side .agent.on::before { content: ''; position: absolute; left: -5px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--c); animation: sel-in .35s var(--spring); }
    @keyframes sel-in { from { transform: scaleY(0); } }
    .side .autopilot { display: flex; gap: 11px; align-items: center; margin: 8px; padding: 10px 12px; border-radius: 14px; background: var(--btn); cursor: pointer; transition: background .18s; }
    .side .autopilot:hover { background: var(--btn-hover); }
    .side .autopilot .glyph { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--fg3); background: var(--btn); transition: background .3s, color .3s, transform .4s var(--spring); }
    .side .autopilot .glyph svg { width: 16px; height: 16px; }
    .side .autopilot:has(:checked) .glyph { color: #fff; background: linear-gradient(160deg, #5aa9ff, var(--accent)); transform: rotate(-8deg); }
    .side .autopilot b { font-size: 13px; font-weight: 650; }
    .side .autopilot p { margin: 1px 0 0; color: var(--fg2); font-size: 11.5px; line-height: 1.3; }

    .center { position: relative; min-width: 0; min-height: 0; }
    .collection { position: absolute; inset: 0; }
    .terms { position: absolute; inset: 0; padding: 12px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); grid-auto-rows: minmax(0, 1fr); }
    .terms.focus { grid-template-columns: minmax(0, 1fr); }
    .terms.focus .tile:not(.on) { display: none; }
    .terms:not(.hidden) .tile { animation: tile-in .45s var(--out) backwards; animation-delay: calc(sibling-index() * 40ms); }
    @keyframes tile-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    /* terminals stay dark in light mode, so their headers carry dark tokens */
    .tile { --c: #888; --fg: #f2f2f4; --fg2: rgba(255, 255, 255, 0.58); --fg3: rgba(255, 255, 255, 0.36); --line: rgba(255, 255, 255, 0.08); --btn: rgba(255, 255, 255, 0.09); --btn-hover: rgba(255, 255, 255, 0.15); --working-ink: #4cd964; --waiting-ink: #ffb340; color: var(--fg); }
    .tile { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #0f1012; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px -18px rgba(0, 0, 0, .6); transition: border-color .25s, box-shadow .25s; }
    .tile.on { border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), 0 14px 36px -18px rgba(0, 0, 0, .7); }
    .tile-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; background: linear-gradient(180deg, rgba(255, 255, 255, .03), transparent); }
    .tile-head b { font-size: 13px; font-weight: 700; }
    .tile-head .model { color: var(--fg3); font-size: 12px; }
    .tile-head .state[data-act] { cursor: pointer; }
    .tile-head .activity { color: var(--fg3); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    .tile-head .icon svg { width: 14px; height: 14px; }
    .tile-head .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--btn); color: var(--fg2); }
    .tile-head .tag.yolo-tag { color: #ff6b81; background: rgba(255, 59, 92, .14); font-weight: 750; letter-spacing: .05em; font-size: 9.5px; }
    .tile-head .tag.fast-tag { color: #ffc24d; background: rgba(255, 176, 32, .15); padding: 2px 4px; line-height: 0; }
    .tile-head .tag.fast-tag svg { width: 11px; height: 11px; }
    .term { flex: 1; min-height: 0; padding: 6px 0 2px 10px; }
    .blank { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; color: var(--fg2); }
    .blank .mark { width: 84px; height: 56px; color: var(--fg3); opacity: .45; animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px); } }
    .blank b { color: var(--fg); font-size: 19px; font-weight: 750; }

    .link-chip { -webkit-app-region: no-drag; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 4px 11px 4px 8px; background: var(--btn); color: var(--fg2); font-weight: 600; cursor: pointer; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .15s, color .15s, transform .25s var(--bounce); }
    .link-chip:hover { background: var(--btn-hover); color: var(--fg); }
    .link-chip:active { transform: scale(.95); }
    .link-chip svg { width: 15px; height: 15px; flex: none; }
    .link-chip.on { color: var(--fg); }

    dialog#link { width: 560px; border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px 18px; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-lg); }
    dialog#link h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 18px; font-weight: 750; }
    dialog#link h3 .h-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #5aa9ff, var(--accent)); }
    dialog#link h3 svg { width: 18px; height: 18px; }
    dialog#link .lead { margin: 0 0 16px; color: var(--fg2); line-height: 1.45; }
    .ls { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
    .ls p { margin: 4px 0 0; color: var(--fg2); font-size: 12.5px; line-height: 1.45; }
    .ls-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
    .ls-row.small { cursor: default; margin-top: 10px; font-size: 12.5px; color: var(--fg2); }
    .code-box { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
    .code-box code { flex: 1; min-width: 0; font: 11.5px var(--mono); padding: 9px 10px; border-radius: 10px; background: var(--btn); overflow-wrap: anywhere; user-select: all; max-height: 74px; overflow: auto; }
    .addr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .addr span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--btn); color: var(--fg2); }
    .addr b { color: var(--fg); font-weight: 650; }
    .code-in { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
    .code-in textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--btn); padding: 8px 10px; font: 11.5px var(--mono); outline: 0; user-select: text; }
    .code-in textarea:focus { border-color: var(--accent); }
    .remote-card { display: flex; gap: 12px; align-items: center; }
    .remote-card b { font-size: 15px; }
    .ls .err { color: var(--danger); min-height: 0; }
    dialog#link .buttons { display: flex; justify-content: flex-end; }

    .chat { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: color-mix(in srgb, var(--surface) 35%, var(--bg)); }
    .chat .feed { flex: 1; }
  </style>
</head>
<body>
  <header class="titlebar">
    <span class="brand"><span class="logo"></span><b>Crew</b></span><span class="sums"></span><span class="grow"></span>
    <button class="link-chip" data-act="link" title="Crew Link: use this crew from your other computers"></button>
    <div class="seg views"><button data-view="crew" title="The crew as cards">Crew</button><button data-view="grid" title="Every terminal side by side">Grid</button><button data-view="focus" title="One terminal, big">Focus</button></div>
    <button class="btn add" data-act="add" title="Add an agent"></button>
    <span class="divider"></span>
    <button class="icon" data-act="theme"></button>
    <button class="icon" data-act="config" title="Open config.json in your text editor"></button>
  </header>
  <main>
    <nav class="side">
      <div class="side-head">Agents <span class="side-count"></span></div>
      <div class="agents"></div>
      <label class="autopilot">
        <span class="glyph"></span>
        <div class="grow"><b>Autopilot</b><p>Agents hand off work without asking you first.</p></div>
        <input type="checkbox" class="switch">
      </label>
    </nav>
    <section class="center">
      <div class="terms"></div>
      <div class="collection hidden"></div>
      <div class="blank hidden"><span class="blank-mark"></span><b>No agents yet</b><span>Give each one a name, an area of work and a model.</span><div><button class="btn primary" data-act="add">Add your first agent</button></div></div>
    </section>
    <aside class="chat">
      <div class="feed"></div>
      <div class="compose"></div>
    </aside>
  </main>


  <dialog id="link">
    <h3><span class="h-icon"></span>Crew Link</h3>
    <p class="lead">One crew, all your computers. The agents, terminals and history stay on one Mac; your other computers connect to it over the same Wi-Fi or Tailscale.</p>
    <div class="link-body"></div>
    <div class="buttons"><button class="btn" data-close>Done</button></div>
  </dialog>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="avatar.js"></script>
  <script src="common.js"></script>
  <script src="collection.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
