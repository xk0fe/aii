<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>Crew</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="collection.css">
  <style>
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    .titlebar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 86px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .titlebar b { font-size: 14px; }
    .titlebar .sub { color: var(--fg2); font-size: 12px; }
    .titlebar button, .seg { -webkit-app-region: no-drag; }
    .seg { display: flex; background: var(--btn); border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: none; padding: 3px 12px; border-radius: 6px; cursor: pointer; color: var(--fg2); font-weight: 500; }
    .seg button.on { background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

    main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 390px; height: calc(100vh - 46px); }
    .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .side .agents { flex: 1; overflow-y: auto; padding: 4px 14px; }
    .side .agent { cursor: pointer; border-radius: 12px; margin: 0 -8px; padding: 10px 8px 12px; border-top: 0 !important; }
    .side .agent:hover { background: var(--btn); }
    .side .agent.on { background: var(--btn-hover); }
    .side .autopilot { display: flex; gap: 10px; align-items: center; padding: 12px 14px 14px; border-top: 1px solid var(--line); }
    .side .autopilot p { margin: 2px 0 0; color: var(--fg2); font-size: 11.5px; }

    .center { position: relative; min-width: 0; min-height: 0; }
    .collection { position: absolute; inset: 0; }
    .terms { position: absolute; inset: 0; padding: 10px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); grid-auto-rows: minmax(0, 1fr); }
    .terms.focus { grid-template-columns: minmax(0, 1fr); }
    .terms.focus .tile:not(.on) { display: none; }
    /* terminals stay dark in light mode, so their headers carry dark tokens */
    .tile { --fg: #f2f2f4; --fg2: rgba(255, 255, 255, 0.58); --fg3: rgba(255, 255, 255, 0.36); --line: rgba(255, 255, 255, 0.1); --btn: rgba(255, 255, 255, 0.09); --btn-hover: rgba(255, 255, 255, 0.15); color: var(--fg); }
    .tile { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #0f1012; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .tile.on { border-color: rgba(255, 255, 255, 0.22); }
    .tile-head { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-bottom: 1px solid var(--line); min-width: 0; white-space: nowrap; }
    .tile-head b { font-size: 13px; }
    .tile-head .model, .tile-head .state { color: var(--fg2); font-size: 12px; }
    .tile-head .state.waiting { color: var(--waiting); font-weight: 600; }
    .tile-head .state[data-act] { cursor: pointer; }
    .tile-head .activity { color: var(--fg3); font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
    .tile-head .icon svg { width: 14px; height: 14px; }
    .tile-head .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--btn); color: var(--fg2); }
    .term { flex: 1; min-height: 0; padding: 6px 0 2px 10px; }
    .blank { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 14px; color: var(--fg2); }
    .blank b { color: var(--fg); font-size: 18px; }

    .chat { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .chat .feed { flex: 1; }

  </style>
</head>
<body>
  <header class="titlebar">
    <b>Crew</b><span class="sub"></span><span class="grow"></span>
    <div class="seg"><button data-view="crew">Crew</button><button data-view="grid">Grid</button><button data-view="focus">Focus</button></div>
    <button class="btn" data-act="add">+ Agent</button>
    <button class="icon" data-act="theme"></button>
    <button class="icon" data-act="config" title="Open config.json in your text editor"></button>
  </header>
  <main>
    <nav class="side">
      <div class="agents"></div>
      <label class="autopilot">
        <div class="grow"><b>Autopilot</b><p>Agents hand work to each other without asking you first.</p></div>
        <input type="checkbox" class="switch">
      </label>
    </nav>
    <section class="center">
      <div class="terms"></div>
      <div class="collection hidden"></div>
      <div class="blank hidden"><b>No agents yet</b><span>Give each one a name, an area of work and a model.</span><div><button class="btn primary" data-act="add">Add your first agent</button></div></div>
    </section>
    <aside class="chat">
      <div class="feed"></div>
      <div class="compose"></div>
    </aside>
  </main>


  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="avatar.js"></script>
  <script src="common.js"></script>
  <script src="collection.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
