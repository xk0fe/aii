<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Crew</title>
  <link rel="stylesheet" href="common.css">
  <style>
    :root { --tray-hover: #dedee3; }
    @media (prefers-color-scheme: dark) { :root { --tray-hover: #3b3b40; } }
    body { background: transparent; padding: 12px 10px 10px; }
    html::-webkit-scrollbar { display: none; }
    header { display: flex; align-items: center; gap: 8px; padding: 2px 6px 8px; }
    header .mark { width: 27px; height: 18px; color: var(--fg); flex: none; }
    header b { font-size: 15px; font-weight: 750; letter-spacing: -.01em; }
    .sums { margin-left: auto; }
    .empty { color: var(--fg2); padding: 18px 10px 20px; text-align: center; line-height: 1.45; }
    /* the crew, by computer: scrolls inside the popover once it's taller than the screen allows */
    /* The popover is the system's material, so rows are clear until hovered; a hovered row is solid, so its
       switches cover what's under them. */
    .roster { --side: transparent; --row-hover: var(--tray-hover); --row-on: var(--tray-hover); max-height: var(--max, 520px); overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .roster .cgroup-head { position: static; }
    .roster .crow-fold:hover { background: var(--tray-hover); }
    .roster .crow.waiting:hover { --bgc: color-mix(in srgb, var(--waiting) 15%, var(--tray-hover)); }
    /* every time the popover opens, the crew cascades in */
    .opened .roster .crow { animation: row-in .42s var(--out) backwards; animation-delay: calc(sibling-index() * 22ms); }
    @keyframes row-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    hr { border: 0; border-top: 1px solid var(--line); margin: 8px 6px; }
    .autopilot { display: flex; align-items: center; gap: 11px; padding: 6px 10px; border-radius: 12px; cursor: pointer; transition: background .18s; }
    .autopilot:hover { background: var(--btn); }
    .autopilot .glyph { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; color: var(--fg3); background: var(--btn); transition: background .3s, color .3s, transform .4s var(--spring); }
    .autopilot .glyph svg { width: 17px; height: 17px; }
    .autopilot:has(:checked) .glyph { color: #fff; background: var(--accent); transform: rotate(-8deg); }
    .autopilot b { font-size: 13.5px; font-weight: 650; }
    .autopilot p { margin: 1px 0 0; color: var(--fg2); font-size: 12px; line-height: 1.3; }
    footer { display: flex; align-items: center; gap: 2px; margin-top: 8px; padding: 0 4px; }
    footer .add { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--btn); color: var(--fg2); }
    footer .add svg { width: 14px; height: 14px; }
    footer .add:hover { background: var(--btn-hover); color: var(--fg); }
    /* the account's usage limits, one row per provider that reports them */
    .usage-row { display: flex; align-items: center; gap: 4px; padding: 2px 10px 8px; color: var(--fg2); font-size: 12.5px; cursor: help; }
    .usage-row b { font-weight: 650; font-variant-numeric: tabular-nums; }
    .usage-row b.warm { color: var(--ctx-warm); }
    .usage-row b.hot { color: var(--ctx-hot); }
    .usage-row i { font-style: normal; color: var(--fg3); }
  </style>
</head>
<body>
  <header><span class="logo"></span><b>Crew</b><span class="sums"></span></header>
  <div class="roster"></div>
  <hr>
  <div class="usage"></div>
  <label class="autopilot" title="Autopilot on: agents hand work to each other without asking. Off: each hand-off waits in the chat for your Send it.">
    <span class="glyph"></span>
    <div class="grow"><b>Autopilot</b><p></p></div>
    <input type="checkbox" class="switch sm">
  </label>
  <footer>
    <button class="btn add" data-act="add"></button>
    <span class="grow"></span>
    <button class="icon" data-act="dashboard" title="Open dashboard"></button>
    <button class="icon" data-theme></button>
    <button class="icon" data-act="config" title="Open config.json in your text editor"></button>
    <button class="icon" data-act="quit" title="Quit Crew"></button>
  </footer>
  <script src="avatar.js"></script>
  <script src="common.js"></script>
  <script src="tray.js"></script>
</body>
</html>
