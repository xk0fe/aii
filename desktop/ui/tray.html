<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>CLIque</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="workspaces.css">
  <style>
    /* The popover is the system's material, so rows are clear until hovered; a hovered row is solid, so the switches
       that appear over it cover what's under them. */
    :root { --tray-hover: #dedee0; }
    @media (prefers-color-scheme: dark) { :root { --tray-hover: #3a3a3a; } }
    body { background: transparent; padding: 12px 10px 10px; }
    /* Windows has no popover material behind the page: a solid sheet with an edge */
    html[data-os=win] body { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line-strong); }
    html[data-os=win] .t-face .unread-badge { --orbit-ring: var(--panel); }
    html::-webkit-scrollbar { display: none; }

    header { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 0 0 6px; margin-bottom: 4px; }
    header .brand { display: flex; align-items: center; gap: 8px; flex: none; }
    header .ws-switch { margin: 0 0 0 -4px; max-width: 250px; }
    header .ws-switch b { font-size: 15px; }
    header [data-act=dashboard] { margin-left: auto; }

    /* what needs you, who's at work and everyone else: scrolls inside the popover once it's taller than the screen allows */
    .lists { max-height: var(--max, 520px); overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
    .lists::-webkit-scrollbar { width: 6px; }
    .lists::-webkit-scrollbar-thumb { border-width: 1px; }
    .needs:empty, .work:empty, .rest:empty { display: none; }
    .needs + .work:not(:empty), .needs + .work + .rest:not(:empty) { margin-top: 2px; }
    .empty { color: var(--fg2); padding: 18px 10px 20px; text-align: center; line-height: 1.45; }
    .t-label { display: flex; align-items: center; height: 26px; padding: 6px 6px 2px; font-size: 12px; font-weight: 500; color: var(--fg2); }
    .t-label.amber { color: var(--needs-ink); }
    /* the mini crew strip: the room in small, everyone on its floor */
    .strip { position: relative; height: 60px; margin: 0 0 6px; }
    .strip-crew { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 8px; }
    .strip-who { all: unset; position: relative; line-height: 0; cursor: pointer; border-radius: var(--r-control); }
    .strip-who:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .strip-who > .dot { position: absolute; right: 0; top: 2px; box-shadow: 0 0 0 2px var(--room-wall); }
    .strip-more { all: unset; align-self: center; height: 22px; padding: 0 7px; border-radius: var(--r-control); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; line-height: 22px; font-weight: 500; color: var(--fg2); cursor: pointer; }
    .strip-more:hover { color: var(--fg); }

    /* one row per agent: the creature, its name with its YOLO and ⚡ tags, and one line of plain words */
    .t-row { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 44px; --pad: 5px; padding: var(--pad) 6px; border-radius: var(--r-card); --bgc: transparent; background: var(--bgc); cursor: default; }
    .t-row:hover { --bgc: var(--tray-hover); }
    .t-row > .av, .t-row > .t-face { justify-self: center; }
    .t-who { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .t-top { display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
    .t-top b { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
    .t-top small { flex: none; color: var(--fg2); font-size: 12px; }
    .t-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--fg2); }
    .t-yolo, .t-fast { flex: none; display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r-tag); box-shadow: inset 0 0 0 1px var(--line-strong); font: 500 11px/1 var(--ui); font-style: normal; color: var(--fg2); }
    /* its sub-agents or clones at work, as a count; the clones' one opens a menu of them */
    .t-end { position: relative; align-self: stretch; display: flex; align-items: center; gap: 4px; }
    .t-count { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px 0 5px; border: 0; border-radius: var(--r-control); background: var(--btn); font: 500 12px/1 var(--ui); font-variant-numeric: tabular-nums; color: var(--fg2); cursor: help; }
    .t-count svg { width: 12px; height: 12px; }
    .t-count.clones { padding-left: 3px; cursor: pointer; transition: background .15s; }
    .t-count.clones:hover { background: var(--btn-hover); color: var(--fg); }
    .t-count .av + .av { margin-left: -7px; }
    .t-top .t-count { height: 16px; padding: 0 5px 0 4px; font-size: 10px; }
    .t-top .t-count svg { width: 10px; height: 10px; }
    /* YOLO, Fast and power, over the end of the line on hover (common.js handles them) */
    .t-acts { position: absolute; right: calc(100% + 2px); top: calc(-1 * var(--pad)); bottom: calc(-1 * var(--pad)); display: flex; align-items: center; gap: 4px; padding-left: 18px; background: linear-gradient(90deg, transparent, var(--bgc) 16px); opacity: 0; pointer-events: none; transition: opacity .15s; }
    .t-row:hover .t-acts, .t-row:has(:focus-visible) .t-acts { opacity: 1; pointer-events: auto; }
    .t-row:has(:focus-visible) { --bgc: var(--tray-hover); }

    /* needs you: tinted, with its one action; the question gets two lines before it's cut */
    .t-need { --bgc: var(--needs-tint); min-height: 46px; }
    .t-need:hover { --bgc: color-mix(in srgb, var(--needs) 16%, transparent); }
    .t-need + .t-need { margin-top: 4px; }
    .t-need .t-line { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
    .t-need .t-line .ws-tile { display: inline-grid; vertical-align: -3px; margin-right: 4px; }
    .t-go { flex: none; min-width: 66px; height: 28px; padding: 0 12px; border: 0; border-radius: var(--r-control); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
    .t-go:hover { background: var(--surface-2); }

    /* the free, off and unreachable ones: one quiet line, and their rows when you open it */
    .t-slim { min-height: 34px; --pad: 2px; }
    .t-slim .t-who { flex-direction: row; align-items: center; gap: 8px; }
    .t-slim .t-top { flex: none; max-width: 60%; }
    .t-slim .t-line { flex: 1; min-width: 0; color: var(--fg2); }
    .t-slim.off > .t-face, .t-slim.away > .t-face, .t-slim.parked > .t-face { opacity: .6; }
    .t-fold { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 30px; padding: 5px 6px; border-radius: var(--r-control); font-size: 12px; line-height: 1.35; color: var(--fg2); cursor: pointer; transition: background .15s, color .15s; }
    .t-fold:hover { background: var(--tray-hover); color: var(--fg); }
    .t-fold:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
    .t-fold .faces { flex: none; display: inline-flex; width: 30px; justify-content: center; }
    .t-fold .faces .av + .av { margin-left: -8px; }
    .t-fold .gap { flex: none; width: 30px; }
    .t-fold .chev { flex: none; display: grid; margin-left: auto; color: var(--fg3); transition: transform .25s var(--out); }
    .t-fold .chev svg { width: 12px; height: 12px; }
    .t-fold[aria-expanded=true] .chev { transform: rotate(90deg); }
    .t-fold.t-more { font-weight: 500; color: var(--fg2); }

    /* every time the popover opens, the rows cascade in */
    .opened .t-in { animation: tray-row-in .32s var(--out) backwards; animation-delay: calc(sibling-index() * 18ms); }
    @keyframes tray-row-in { from { opacity: 0; transform: translateY(4px); } }

    /* a clone's creature as a menu icon (popMenu's labels are spans that grow; the creature's spans mustn't) */
    .menu button > .av, .menu button > .av span { flex: none; overflow: visible; }
    .t-hr { height: 1px; margin: 6px 6px; background: var(--line); }
    .t-hr.first { margin-top: 8px; }
    /* the accounts' limits: a bar each and the one thing that matters about it */
    .t-use { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 30px; padding: 0 6px; font-size: 13px; cursor: help; }
    .t-use b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-use .bar { height: 4px; border-radius: 2px; background: var(--fill-hover); overflow: hidden; }
    .t-use .bar i { display: block; height: 100%; border-radius: 2px; background: var(--fg2); }
    .t-use .bar.warm i { background: var(--needs); }
    .t-use .say { white-space: nowrap; color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; }
    .t-use .say.warm { color: var(--needs-ink); font-weight: 500; }

    .autopilot { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px; border-radius: var(--r-control); cursor: pointer; transition: background .18s; }
    .autopilot:hover { background: var(--tray-hover); }
    .autopilot .glyph { width: 16px; height: 16px; display: grid; place-items: center; flex: none; color: var(--fg2); }
    .autopilot .glyph svg { width: 16px; height: 16px; }
    .autopilot b { flex: 1; font-size: 13px; font-weight: 500; }
    footer { display: flex; align-items: center; gap: 2px; margin-top: 6px; padding: 0 2px; }
    footer .add { height: 28px; padding: 0 12px 0 10px; }
    footer .add svg { width: 14px; height: 14px; }
    footer .icon { width: 28px; height: 28px; }
    footer .icon[aria-expanded=true] { background: var(--btn); color: var(--fg); }
      /* a creature with its unread replies in the corner */
    .t-face { position: relative; flex: none; line-height: 0; }
    .t-face .unread-badge { right: -4px; bottom: -2px; --orbit-ring: var(--bg, #ececef); }
  </style>
</head>
<body>
  <header><span class="brand"></span><button class="ws-switch hidden" aria-haspopup="menu"></button><button class="icon" data-act="dashboard" title="Open the dashboard"></button></header>
  <div class="t-strip"></div>
  <div class="lists">
    <div class="needs"></div>
    <div class="work"></div>
    <div class="rest"></div>
  </div>
  <div class="usage"></div>
  <div class="t-hr"></div>
  <label class="autopilot">
    <span class="glyph"></span>
    <b>Autopilot</b>
    <input type="checkbox" class="switch sm">
  </label>
  <footer>
    <button class="btn add" data-act="add"></button>
    <span class="grow"></span>
    <button class="icon" data-act="settings" title="Settings" aria-haspopup="menu"></button>
    <button class="icon" data-act="quit" title="Quit CLIque"></button>
  </footer>
  <script src="avatar.js"></script>
  <script src="common.js"></script>
  <script src="brand.js"></script>
  <script src="tray.js"></script>
</body>
</html>
