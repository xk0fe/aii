<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>CLIque</title>
  <link rel="stylesheet" href="common.css">
  <style>
    html, body { background: transparent; overflow: hidden; }
    /* The chat opens on the side of the pill away from the screen edge (main.js and core/pill.js decide, this
       lays it out): data-side is where the chat goes, data-align how it lines up with the pill. */
    .wrap { display: inline-flex; align-items: center; gap: 10px; padding: 18px; }
    [data-side=right] .wrap { flex-direction: row-reverse; }
    [data-side=above] .wrap { flex-direction: column; }
    [data-side=below] .wrap { flex-direction: column-reverse; }
    [data-align=start] .wrap { align-items: flex-start; }
    [data-align=end] .wrap { align-items: flex-end; }
    /* Solid sheets, not glass: a transparent window can't blur the desktop behind it, so glass would let whatever
       is underneath (a terminal, a web page) show through the text. */
    .sheet { background: var(--panel); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .14), 0 10px 26px -14px rgba(0, 0, 0, .4), 0 3px 8px -4px rgba(0, 0, 0, .14); }
    @media (prefers-color-scheme: dark) {
      .sheet { box-shadow: 0 0 0 .5px rgba(0, 0, 0, .7), inset 0 0 0 .5px rgba(255, 255, 255, .1), 0 10px 26px -14px rgba(0, 0, 0, .7), 0 3px 8px -4px rgba(0, 0, 0, .4); }
    }

    /* the panel grows out of the pill: from its right when it opens to the left, and so on */
    .panel { --from: translate(14px, 0); display: none; width: 400px; height: 600px; border-radius: var(--r-window); flex-direction: column; overflow: hidden; transform-origin: 100% 50%; }
    [data-side=right] .panel { --from: translate(-14px, 0); transform-origin: 0 50%; }
    [data-side=above] .panel { --from: translate(0, 14px); transform-origin: 50% 100%; }
    [data-side=below] .panel { --from: translate(0, -14px); transform-origin: 50% 0; }
    .open .panel { display: flex; animation: panel-in .3s var(--out); }
    .open.moved .panel { animation: panel-moved .3s var(--out); } /* it switched sides */
    @keyframes panel-in { from { opacity: 0; transform: var(--from) scale(.97); } }
    @keyframes panel-moved { from { opacity: 0; transform: var(--from) scale(.97); } }
    .panel header { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 8px 0 14px; flex: none; cursor: grab; }
    .panel header .brand { display: flex; align-items: center; gap: 7px; }
    .panel header b { font-size: 15px; font-weight: 600; }
    .panel header .sums { margin-left: 4px; }
    .panel header .icon { width: 28px; height: 28px; padding: 0; }
    /* in a conversation with one agent, it takes the header's left side (same height, so nothing moves) */
    .panel header.in-convo { padding-left: 9px; }
    .panel header.in-convo .brand, .panel header.in-convo .sums, .panel header.in-convo > .grow { display: none; }
    .panel header .convo-head { flex: 1; }
    /* a thread, over the chat, under the panel's header */
    .panel { position: relative; }
    .panel > .thread { position: absolute; inset: 48px 0 0; z-index: 3; }
    .panel .feed { flex: 1; }
    .panel .compose { flex: none; }

    /* The pill: the clique as little creatures on the screen edge. */
    .pill { width: 52px; border-radius: 26px; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: grab; touch-action: none; transition: box-shadow .3s; }
    .dragging .pill, .dragging .panel header { cursor: grabbing; }
    /* at the top or bottom of the screen the pill lies flat, like the Dock */
    [data-side=above] .pill, [data-side=below] .pill { flex-direction: row; width: auto; height: 52px; padding: 0 10px 0 6px; }
    [data-side=above] .dots, [data-side=below] .dots { flex-direction: row; }
    .home { width: 40px; height: 36px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 3px; border-radius: var(--r-card); transition: background .15s; }
    .home:hover { background: var(--btn); }
    .pill { position: relative; }
    .home-badge { position: absolute; top: 4px; right: 3px; pointer-events: none; }
    .home-badge .unread-badge { position: static; }
    /* in the pill the creatures stack, so a count sits on the left, clear of the "!" of the one below */
    .dots .unread-badge { right: auto; bottom: auto; left: -5px; top: -3px; }
    .home + .dots:not(:empty) { padding-top: 7px; border-top: 1px solid var(--line); width: 32px; }
    [data-side=above] .home + .dots:not(:empty), [data-side=below] .home + .dots:not(:empty) { padding: 0 0 0 7px; border-top: 0; border-left: 1px solid var(--line); width: auto; height: 32px; }
    .home svg { width: 100%; height: 100%; display: block; overflow: visible; }
    /* the buddies are stacked <svg>s, one per span (markSVG split), so their hops run on the compositor */
    .home { container-type: size; }
    .home .marks { position: relative; display: block; width: 100%; height: 100%; }
    .home .marks > span { position: absolute; inset: 0; }
    /* while anyone works, the three buddies hop in a little wave */
    .home path { transform-box: fill-box; transform-origin: 50% 100%; }
    .busy .home .m0, .busy .home .m1, .busy .home .m2 { animation: buddy-hop 1.1s cubic-bezier(.3, .6, .4, 1) infinite; }
    .busy .home .m1 { animation-delay: .14s; }
    .busy .home .m2 { animation-delay: .28s; }
    /* 2.4 units of the mark's viewBox (24 × 16, fitted into the button): the hop it always had, in px */
    @keyframes buddy-hop { 0%, 55%, 100% { translate: 0 0; } 25% { translate: 0 calc(-2.4 * min(100cqw / 24, 100cqh / 16)); } }
    /* someone needs you: a warm edge that breathes (their creature wiggles). The edge is its own layer that only fades
       in and out, so the compositor plays it. */
    .pill::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--needs) 75%, transparent), 0 0 0 5px color-mix(in srgb, var(--needs) 16%, transparent); }
    .alert .pill::after { animation: pill-alert 2s ease-in-out infinite; }
    @keyframes pill-alert { 50% { opacity: 1; } }
    /* the clique lives in the pill: one little creature per agent, hopping while it works, magnified like the Dock */
    .dots { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    /* creatures magnify away from the screen edge */
    .dots .face { position: relative; cursor: pointer; line-height: 0; transition: transform var(--t-quick) var(--out); transform-origin: 70% 50%; --orbit-ring: var(--panel); --dot: 6px; }
    [data-side=right] .dots .face { transform-origin: 30% 50%; }
    [data-side=below] .dots .face { transform-origin: 50% 25%; }
    [data-side=above] .dots .face { transform-origin: 50% 75%; }
    .dots .face:hover { transform: scale(1.32); z-index: 1; }
    .dots .face:hover + .face, .dots .face:has(+ .face:hover) { transform: scale(1.12); }
    .dots .face:active { transform: scale(1.05); }
    .more-faces { width: 32px; height: 26px; margin-top: 2px; border: 0; border-radius: var(--r-control); background: var(--btn); color: var(--fg2); font: 500 11px/1 var(--ui); font-variant-numeric: tabular-nums; cursor: pointer; transition: background .15s, color .15s; }
    .more-faces:hover { background: var(--btn-hover); color: var(--fg); }
    /* a clone pops out of its original (the creature before it), a little smaller, with its number */
    .dots .face { position: relative; }
    .dots .face.clone { margin-top: -3px; animation: clone-pop .6s var(--bounce) backwards; }
    [data-side=above] .dots .face.clone, [data-side=below] .dots .face.clone { margin: 0 0 0 -3px; animation-name: clone-pop-x; }
    .dots .clone-no { position: absolute; right: -4px; bottom: -2px; margin: 0; height: 13px; min-width: 13px; padding: 0 3px; font-size: 8.5px; color: var(--fg); background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .18); }
    @keyframes clone-pop { from { opacity: 0; transform: translateY(-75%) scale(.3); } }
    @keyframes clone-pop-x { from { opacity: 0; transform: translateX(-75%) scale(.3); } }

    /* ---- in the hatch: dragged to the notch at the top of the screen (core/pill.js), it becomes part of it. A black
       band around the notch, the mark on its left and the clique on its right; the chat hangs from it, one black shape. */
    /* as wide as it wants to be, not as the window happens to be: the window is fitted around this */
    [data-side=hatch] .wrap { flex-direction: column-reverse; gap: 0; width: max-content; padding: 0 12px 10px; }
    [data-side=hatch].open .wrap { align-items: stretch; padding-bottom: 18px; }
    [data-side=hatch] .sheet { box-shadow: none; }
    [data-side=hatch] .pill { display: grid; grid-template-columns: minmax(46px, 1fr) var(--notch-w, 120px) minmax(46px, 1fr); align-items: center; gap: 0; width: max-content; height: var(--notch-h, 28px); padding: 0 6px; border-radius: 0 0 12px 12px; animation: hatch-in var(--t-move) var(--out); }
    /* open, the band and the chat are one width, whichever needs more: the band says how wide (at least the chat's width),
       and the chat's own text has no say */
    [data-side=hatch].open .pill { min-width: 400px; border-radius: 0; }
    [data-side=hatch].open .panel { width: 0; min-width: 100%; }
    @keyframes hatch-in { from { transform: translateY(-100%); } }
    [data-side=hatch] .home { grid-column: 1; justify-self: start; width: 32px; height: 22px; padding: 2px; }
    [data-side=hatch] .home-badge { top: 3px; left: 28px; right: auto; transform: scale(.78); }
    [data-side=hatch] .dots { grid-column: 3; justify-self: end; flex-direction: row; gap: 3px; }
    [data-side=hatch] .dots .face { transform-origin: 50% 20%; }
    /* over the creature's own corner rather than the one before it, small enough to leave its face showing */
    [data-side=hatch] .dots .unread-badge { left: auto; right: -5px; top: -4px; transform: scale(.78); }
    [data-side=hatch] .dots .face.clone { margin: 0 0 0 -3px; animation-name: clone-pop-x; }
    [data-side=hatch] .more-faces { width: 26px; height: 20px; margin: 0 0 0 2px; }
    [data-side=hatch] .panel { --from: translate(0, -10px); transform-origin: 50% 0; border-radius: 0 0 22px 22px; box-shadow: 0 16px 28px -14px rgba(0, 0, 0, .75); }
    /* the chat is already wide open: the band stays calm, and the one who needs you wiggles in it */
    [data-side=hatch].open .pill::after { display: none; }
    [data-side=hatch] .panel .compose { padding-bottom: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel sheet">
      <header>
        <div class="convo-head"></div><span class="brand"></span><span class="sums"></span><span class="grow"></span>
        <button class="icon" data-act="dashboard" title="Open the dashboard" aria-label="Open the dashboard"></button>
        <button class="icon" data-act="close" title="Close (Esc)" aria-label="Close"></button>
      </header>
      <div class="feed"></div>
      <div class="compose"></div>
      <div class="thread"></div>
    </section>
    <aside class="pill sheet">
      <button class="home" title="CLIque"></button><span class="home-badge"></span>
      <div class="dots"></div>
    </aside>
  </div>
  <script src="avatar.js"></script>
  <script src="voice.js"></script>
  <script src="canvas.js"></script>
  <script src="common.js"></script>
  <script src="brand.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
