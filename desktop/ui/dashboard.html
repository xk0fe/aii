<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>Crew</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="collection.css">
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="workspaces.css">
  <style>
    html, body { height: 100%; background: var(--bg); overflow: hidden; }
    /* Three columns in the titlebar: the workspace on the left, the views centered, what needs you and ⋯ on the right.
       Grid columns (not flex), so the right end coming and going never pushes the views off center. */
    .titlebar { height: 46px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 10px 0 86px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
    .tb-left, .tb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .tb-right { justify-content: flex-end; gap: 6px; }
    .titlebar button, .seg { -webkit-app-region: no-drag; }
    .titlebar .icon { width: 30px; height: 30px; padding: 0; flex: none; }
    .seg.views button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 16px; }
    .seg.views button svg { width: 15px; height: 15px; flex: none; }
    /* the one loud thing up here: who needs you, their faces (they wiggle) and how many. Hidden while nobody does. */
    .tb-needs { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 8px; border: 0; border-radius: 999px; font: inherit; font-weight: 650; white-space: nowrap; color: var(--waiting-ink); background: color-mix(in srgb, var(--waiting) 15%, transparent); cursor: pointer; transition: background .15s, transform .25s var(--bounce); }
    .tb-needs:not(.hidden) { animation: tb-needs-in .45s var(--spring); }
    .tb-needs:hover { background: color-mix(in srgb, var(--waiting) 24%, transparent); }
    .tb-needs:active { transform: scale(.95); }
    .tb-faces { display: inline-flex; align-items: center; }
    .tb-faces .av + .av { margin-left: -6px; }
    @keyframes tb-needs-in { from { opacity: 0; transform: scale(.85); } }
    /* new replies you haven't read: a small blue dot on ⋯ (its menu jumps to the first) */
    .tb-more { position: relative; }
    .tb-more.has-new::after { content: ''; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }

    /* One row, exactly the window's height. Left auto, the grid measures each column's natural height on every layout,
       and for the chat that means laying out its whole history again for each keystroke or status tick. */
    main { --side-w: 264px; --chat-w: 384px; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr) var(--chat-w); grid-template-rows: minmax(0, 1fr); height: calc(100vh - 46px); transition: grid-template-columns .32s var(--sheet); }
    /* either side can be put away for more room in the middle (the ⋯ menu, ⌘⌥S and ⌘⌥C) */
    @media (max-width: 1240px) { main { --side-w: 232px; --chat-w: 336px; } .seg.views button { padding: 4px 11px; } }
    @media (max-width: 1060px) { .seg.views button span { display: none; } }
    body.no-side main { --side-w: 0px; }
    body.no-chat main { --chat-w: 0px; }
    body.no-side .side, body.no-chat .chat { visibility: hidden; overflow: hidden; }
    .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); }
    .side-top { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px; }
    .find { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: var(--r-sm); background: var(--btn); color: var(--fg3); cursor: text; transition: box-shadow .15s, background .15s; }
    .find:focus-within { background: var(--field); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    .find svg { width: 14px; height: 14px; flex: none; }
    .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 12.5px; color: var(--fg); user-select: text; }
    .find input::placeholder { color: var(--fg3); }
    .find input::-webkit-search-cancel-button { display: none; }
    .find kbd { font: 600 10px var(--mono); color: var(--fg3); padding: 1px 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line-strong); }
    .find:focus-within kbd { display: none; }
    .side-top .icon { width: 30px; height: 30px; padding: 0; flex: none; border-radius: var(--r-sm); background: var(--btn); color: var(--fg2); }
    .side-top .icon:hover { background: var(--btn-hover); color: var(--fg); }
    .side-top .icon svg { width: 15px; height: 15px; }
    .side .roster { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 10px 8px; scrollbar-gutter: stable; }
    /* The footer: Autopilot one click away, then this Mac's computers and the account's usage as two quiet chips.
       A fixed height, so nothing above it moves when a chip changes. */
    .side-foot { flex: none; display: flex; flex-direction: column; gap: 6px; height: 86px; padding: 8px 10px 10px; border-top: 1px solid var(--line); container-type: inline-size; }
    .side .autopilot { flex: none; display: flex; gap: 10px; align-items: center; height: 34px; margin: 0; padding: 0 4px; border-radius: 9px; cursor: pointer; transition: background .18s; }
    .side .autopilot:hover { background: var(--row-hover); }
    .side .autopilot .glyph { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--fg3); background: var(--btn); transition: background .3s, color .3s, transform .4s var(--spring); }
    .side .autopilot .glyph svg { width: 14px; height: 14px; }
    .side .autopilot:has(:checked) .glyph { color: #fff; background: var(--accent); transform: rotate(-8deg); }
    .side .autopilot b { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }
    .foot-chips { flex: none; display: flex; gap: 6px; height: 28px; }
    .foot-chip { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px; height: 28px; padding: 0 7px; border: 0; border-radius: 8px; background: var(--btn); color: var(--fg2); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; transition: background .15s, color .15s, transform .25s var(--bounce); }
    .foot-chip:hover { background: var(--btn-hover); color: var(--fg); }
    .foot-chip:active { transform: scale(.96); }
    .foot-chip svg { width: 14px; height: 14px; flex: none; }
    .foot-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .foot-chip .pc-off { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px var(--waiting); }
    .use-gauge { flex: none; width: 24px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .use-gauge i { display: block; height: 100%; border-radius: 3px; background: var(--fg3); }
    .use-chip.warm { color: var(--waiting-ink); }
    .use-chip.warm .use-gauge i { background: var(--waiting); }
    @container (max-width: 236px) { .foot-chip.link-chip svg, .use-gauge { display: none; } } /* the narrow sidebar keeps the words */
    /* the usage chip's popover: each account's limits on a line */
    .use-pop { inset: auto; margin: 0; min-width: 220px; max-width: 320px; padding: 8px 10px; border: 0; border-radius: var(--r-md); background: var(--card); color: var(--fg); font-size: 12.5px; box-shadow: 0 0 0 1px var(--line-strong), 0 16px 40px -12px rgba(0, 0, 0, .35); }
    .use-pop:popover-open { display: flex; flex-direction: column; gap: 6px; }
    .use-pop .up-row { display: flex; flex-direction: column; gap: 2px; padding: 3px 2px; }
    .use-pop .up-row + .up-row { border-top: 1px solid var(--line); padding-top: 7px; }
    .use-pop .usage-line { display: flex; align-items: baseline; gap: 5px; font-weight: 600; }
    .use-pop .warm { color: var(--ctx-warm); }
    .use-pop .hot { color: var(--ctx-hot); }
    .use-pop small { color: var(--fg2); font-size: 11.5px; }
    .use-pop small.warn { color: var(--waiting-ink); font-weight: 600; }

    .center { position: relative; min-width: 0; min-height: 0; }
    .collection { position: absolute; inset: 0; }
    /* Grid: tiles stay tall enough to read (a dozen lines or so) and the grid scrolls, rather than squeezing
       every terminal down to three lines. Two columns once there's room for two full-width terminals. */
    .terms-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    /* which terminals (with counts) on the left, Grid or Focus on the right */
    .tv-head { flex: none; display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 14px; }
    .tv-show button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px; }
    .tv-show button i { font-style: normal; font-weight: 600; color: var(--fg3); font-variant-numeric: tabular-nums; }
    .tv-show button[data-show=needs] i.some { color: var(--waiting-ink); }
    .tv-show.idle { opacity: .55; } /* in Focus the filter waits for the grid; a click on it goes back there */
    .tv-show.idle:hover { opacity: 1; }
    .tv-layout button { display: grid; place-items: center; width: 34px; height: 26px; padding: 0; }
    .tv-layout button svg { width: 15px; height: 15px; }
    .terms { position: relative; flex: 1; min-height: 0; padding: 2px 14px 14px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); grid-auto-rows: minmax(250px, 1fr); overflow-y: auto; }
    .terms.focus { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); overflow: hidden; }
    .terms.focus .tile:not(.on) { display: none; }
    .terms .tile.filtered { display: none; }
    .terms-none { grid-column: 1 / -1; align-self: center; justify-self: center; color: var(--fg3); font-size: 13px; }
    .terms-view:not(.hidden) .tile { animation: tile-in .45s var(--out) backwards; animation-delay: calc(sibling-index() * 40ms); }
    @keyframes tile-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    /* terminals stay dark in light mode, so their headers carry dark tokens */
    .tile { --c: #888; --fg: #f2f2f4; --fg2: rgba(255, 255, 255, 0.6); --fg3: rgba(255, 255, 255, 0.38); --line: rgba(255, 255, 255, 0.08); --btn: rgba(255, 255, 255, 0.08); --btn-hover: rgba(255, 255, 255, 0.14); --working-ink: #4cd964; --waiting-ink: #ffb340; --starting: #64a8ff; --yolo-ink: #ff6b81; --fast-ink: #ffc24d; color: var(--fg); }
    .tile { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #0f1012; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 10px 30px -18px rgba(0, 0, 0, .6); transition: box-shadow .25s; }
    @media (prefers-color-scheme: light) { .tile { box-shadow: 0 0 0 1px rgba(0, 0, 0, .14), 0 10px 28px -16px rgba(0, 0, 0, .45); } }
    .tile.on { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--c) 70%, transparent), 0 0 0 4px color-mix(in srgb, var(--c) 16%, transparent), 0 14px 36px -18px rgba(0, 0, 0, .7); }
    /* a terminal that's waiting on you says so with its outline (and its Answer button) */
    .tile.needs, .tile.needs.on { box-shadow: 0 0 0 2px var(--waiting), 0 10px 28px -16px rgba(0, 0, 0, .5); }
    /* One header row: who, how it is, its model; then its helpers and what this view is (LIVE, MIRROR…). A narrow tile
       lets the model word go first (it's in the badge's tooltip too). */
    .tile { container-type: inline-size; }
    @container (max-width: 360px) { .tile-head { gap: 6px; } .tile-head .ctx b { display: none; } }
    /* YOLO and Fast show on a roomy tile (Focus, a wide grid); a narrow one keeps its model word instead, and the marks
       stay on the agent's row and card */
    .tile-head .mark-yolo, .tile-head .mark-fast, .tile-head .mark-holds { flex: none; }
    @container (max-width: 480px) { .tile-head .mark-yolo, .tile-head .mark-fast, .tile-head .mark-holds { display: none; } }
    .tile-head { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 10px; min-width: 0; white-space: nowrap; background: #16171a; }
    .tile-head .tile-av { position: relative; flex: none; line-height: 0; margin-right: -1px; }
    .tile-head .t-name { flex: none; font-size: 13px; font-weight: 700; }
    .tile-head .t-home { font-weight: 500; color: var(--fg3); }
    .tile-head .t-mid { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; height: 18px; overflow: hidden; line-height: 18px; }
    .tile-head .t-state { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--fg2); }
    .tile-head .t-state.working { color: var(--working-ink); }
    .tile-head .t-state.starting { color: var(--starting); }
    .tile-head .t-state.waiting { color: var(--waiting-ink); font-weight: 650; }
    .tile-head .t-state.blocked { color: #a5a3ff; }
    .tile-head .t-state.stopped, .tile-head .t-state.away { color: var(--fg3); }
    .tile-head .t-state[data-act] { cursor: pointer; }
    .tile-head .t-model { flex: none; font-size: 12px; color: var(--fg3); }
    .t-chip { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px 0 4px; border-radius: 999px; background: var(--btn); color: var(--fg2); font: 700 11px/1 var(--ui); font-variant-numeric: tabular-nums; cursor: help; }
    .t-chip svg { width: 12px; height: 12px; }
    .t-chip.clones { padding-left: 2px; }
    .t-chip .av + .av { margin-left: -7px; }
    /* What this view is. These aren't terminal apps: the badge says whether typing reaches the agent right now (LIVE, or
       MIRROR from another computer), or that it's being redrawn (REPLAY), or frozen (OFFLINE, ENDED). See tileMode(). */
    .t-badge { --rb: #4cd964; flex: none; display: inline-flex; align-items: center; gap: 5px; height: 17px; padding: 0 7px 0 6px; border-radius: 5px; font: 700 9px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--rb); background: color-mix(in srgb, var(--rb) 14%, transparent); cursor: help; }
    .t-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .t-badge[data-mode=live]::before, .t-badge[data-mode=mirror]::before, .t-badge[data-mode=replay]::before { animation: pulse 2.4s ease-in-out infinite; }
    .t-badge[data-mode=mirror] { --rb: #7aa2ff; }
    .t-badge[data-mode=replay] { --rb: #c58cff; }
    .t-badge[data-mode=offline] { --rb: #ffb340; }
    .t-badge[data-mode=ended] { --rb: #a1a1aa; }
    .t-answer { flex: none; height: 24px; padding: 0 10px; border: 0; border-radius: 7px; background: #ffb340; color: #241500; font-weight: 650; font-size: 12px; cursor: pointer; transition: background .15s, transform .25s var(--bounce); }
    .t-answer:hover { background: #ffc266; }
    .t-answer:active { transform: scale(.94); }
    /* the four actions float over the terminal's corner: on hover, and on the one picked. Out of the header, so it
       never shifts. */
    .tile-acts { position: absolute; top: 46px; right: 8px; z-index: 2; display: flex; gap: 1px; padding: 2px; border-radius: 9px; background: #232428; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 6px 16px -6px rgba(0, 0, 0, .6); opacity: 0; pointer-events: none; transition: opacity .15s; }
    .tile:hover .tile-acts, .tile.on .tile-acts, .tile-acts:focus-within { opacity: 1; pointer-events: auto; }
    .tile-acts .icon { width: 28px; height: 28px; padding: 0; color: rgba(255, 255, 255, .6); }
    .tile-acts .icon:hover { color: #fff; background: rgba(255, 255, 255, .1); }
    .tile-acts .icon svg { width: 14px; height: 14px; }
    .tile-acts [data-act=fresh][aria-pressed=true] { color: #7aa2ff; background: rgba(122, 162, 255, .16); }
    /* frozen output looks frozen */
    .tile[data-mode=offline] .term, .tile[data-mode=ended] .term { opacity: .5; filter: grayscale(.7); transition: opacity .3s; }
    .term { flex: 1; min-height: 0; padding: 6px 0 2px 10px; }
    .blank { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; color: var(--fg2); }
    .blank .mark { width: 84px; height: 56px; color: var(--fg3); opacity: .45; animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px); } }
    .blank b { color: var(--fg); font-size: 19px; font-weight: 750; }

    dialog.sheet { width: 600px; max-height: calc(100vh - 80px); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px 18px; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-lg); }
    dialog.sheet[open] { display: flex; flex-direction: column; }
    dialog.sheet .sheet-body { overflow-y: auto; min-height: 0; margin: 0 -6px; padding: 0 6px; }
    dialog.sheet h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 18px; font-weight: 750; }
    dialog.sheet h3 .h-icon { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(160deg, #5aa9ff, var(--accent)); }
    dialog.sheet h3 svg { width: 18px; height: 18px; }
    dialog.sheet .lead { margin: 0 0 16px; color: var(--fg2); line-height: 1.45; }
    dialog.sheet .buttons { display: flex; justify-content: flex-end; gap: 8px; padding-top: 6px; }
    /* Computers: grouped rows (This Mac, Linked, Phones), each a line of plain words with its control on the right.
       Details fold away: the addresses behind one row, each linked computer's agents behind its chevron. */
    #link { margin: 40px auto auto; } /* top-anchored: unfolding a row grows the sheet downwards, so the row stays under the hand */
    #link .lead { margin-bottom: 10px; }
    .lk-label { padding: 12px 2px 6px; font-size: 12px; font-weight: 650; color: var(--fg3); }
    .lk-label:first-child { padding-top: 0; }
    .lk-list { border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
    .lk-li { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px 14px 8px 16px; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
    .lk-list > * + * { box-shadow: inset 0 1px 0 var(--line); }
    .lk-k { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13.5px; font-weight: 600; }
    .lk-k small { font-size: 12px; font-weight: 450; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lk-k small .lk-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; vertical-align: 0; background: var(--working); }
    .lk-k small .lk-dot.off { background: none; box-shadow: inset 0 0 0 1.5px var(--fg3); }
    .lk-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--btn); color: var(--fg2); }
    .lk-ic svg { width: 18px; height: 18px; }
    .lk-sw { cursor: pointer; }
    .lk-note { flex: 1; min-width: 0; font-size: 12.5px; color: var(--fg2); }
    .lk-copy { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 150px; height: 32px; } /* Copied fits in place of Copy link code, without a nudge */
    .lk-copy svg { width: 15px; height: 15px; }
    .lk-chev { flex: none; width: 14px; height: 14px; color: var(--fg3); transition: transform .3s var(--spring); }
    .lk-chev svg { display: block; width: 14px; height: 14px; }
    [aria-expanded=true] > .lk-chev { transform: rotate(90deg); }
    button.lk-li { cursor: pointer; transition: background .15s; }
    button.lk-li:hover { background: color-mix(in srgb, var(--fg) 3%, transparent); }
    .lk-more { min-height: 44px; font-size: 12.5px; color: var(--fg2); }
    .lk-more > span:first-child { flex: 1; }
    .lk-faces { flex: none; display: inline-flex; align-items: center; }
    .lk-faces .av + .av { margin-left: -7px; }
    .lk-faces i { margin-left: 4px; font: 650 11px var(--ui); font-style: normal; color: var(--fg3); }
    .lk-pc.fresh { border-radius: 14px; box-shadow: 0 0 0 2px var(--accent); }
    .lk-body { padding: 0 14px 12px 16px; }
    .lk-body > p { margin: 0 0 8px; font-size: 12.5px; color: var(--fg2); line-height: 1.45; }
    .lk-details { display: block; padding: 10px 14px 12px 16px; font-size: 12.5px; color: var(--fg2); }
    .lk-details p { margin: 0 0 8px; line-height: 1.45; }
    .lk-details code { display: block; font: 11px var(--mono); padding: 7px 9px; border-radius: 8px; background: var(--btn); color: var(--fg); overflow-wrap: anywhere; user-select: all; max-height: 60px; overflow: auto; }
    .lk-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12.5px; color: var(--fg2); }
    .lk-btns { flex: none; display: flex; gap: 6px; }
    .lk-empty { font-size: 12.5px; color: var(--fg2); min-height: 48px; }
    .lk-form { display: block; padding: 12px 14px 12px 16px; }
    .lk-form p { margin: 0; font-size: 12.5px; color: var(--fg2); line-height: 1.45; }
    #link .buttons { justify-content: flex-start; align-items: center; padding-top: 14px; }
    #link .buttons .btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; }
    #link .buttons .btn svg { width: 15px; height: 15px; }
    #link [data-link-add][aria-pressed=true] { background: var(--btn-hover); }
    .addr { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .addr span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--btn); color: var(--fg2); }
    .addr b { color: var(--fg); font-weight: 650; }
    .code-in { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
    .code-in textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 8px 10px; font: 11.5px var(--mono); outline: 0; user-select: text; }
    .code-in textarea:focus { border-color: var(--accent); }
    .me-name { font: inherit; font-weight: 600; font-size: 13.5px; border: 1px solid transparent; border-radius: 7px; background: transparent; padding: 1px 6px; margin: -2px 0 -1px -7px; width: 230px; max-width: 100%; outline: 0; color: var(--fg); }
    .me-name:hover { background: var(--btn); }
    .me-name:focus { border-color: var(--accent); background: var(--field); }
    .lk-agents { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .lk-agents li { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 12px; }
    .lk-agents li:hover { background: var(--btn); }
    .lk-agents li.unused .av, .lk-agents li.unused .who { opacity: .45; }
    .lk-agents .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .lk-agents .who small { color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lk-move { display: inline-flex; align-items: center; gap: 5px; opacity: 0; transition: opacity .15s; }
    .lk-move svg { width: 13px; height: 13px; }
    .lk-agents li:hover .lk-move, .lk-move:focus-visible { opacity: 1; }
    .lk-agents .use { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); cursor: pointer; }
    .lk-list .err, .sheet .err { color: var(--danger); min-height: 0; margin: 4px 0 0; font-size: 12.5px; }
    .lk-list .err:empty { display: none; }
    /* phones: Add a phone, then each paired phone */
    .phones { padding: 12px 14px 10px 16px; }
    .phones p { margin: 4px 0 0; color: var(--fg2); font-size: 12.5px; line-height: 1.45; }
    .ph-head { display: flex; align-items: center; gap: 16px; }
    .ph-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .ph-list li { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 12px; transition: background .3s; }
    .ph-list li:hover { background: var(--btn); }
    .ph-list li.fresh { background: color-mix(in srgb, var(--accent) 11%, transparent); }
    .ph-icon { flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .ph-icon svg { width: 18px; height: 18px; }
    .ph-list .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .ph-list .who b { overflow-wrap: anywhere; }
    .ph-list .who small { color: var(--fg3); }
    .ph-seen { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); white-space: nowrap; }
    .dot.live { background: var(--working); }
    /* Add a phone: the dialog becomes one view about pairing. The code sits high and big on a white card (its quiet
       zone, whatever the theme), one line under it, and the buttons where the list's are. Nothing in it changes size:
       a new code, an error or a phone that paired only change what's on the card and the line. */
    #link.pairing > :not(.pair-view), #link:not(.pairing) > .pair-view { display: none; }
    .pair-view { display: flex; flex-direction: column; animation: pv-in .3s var(--out); }
    .pair-view:focus-visible { outline: none; }
    #link.back > :not(.pair-view) { animation: pv-back .3s var(--out); }
    @keyframes pv-in { from { opacity: 0; transform: translateX(14px); } }
    @keyframes pv-back { from { opacity: 0; transform: translateX(-14px); } }
    .pair-view h3 { margin-bottom: 18px; }
    .pv-card { align-self: center; display: grid; place-items: center; width: var(--card); height: var(--card); border-radius: 26px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 14px 34px -18px rgba(20, 20, 40, .35); transition: background .4s var(--out), box-shadow .4s var(--out); }
    .pv-card > * { grid-area: 1 / 1; }
    .pv-card > svg { display: block; width: var(--qr); height: var(--qr); transition: opacity .25s, scale .35s var(--out); }
    /* still making the first code: a spinner, only if that takes a moment */
    .pv-card.wait::after { content: ''; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(0, 0, 0, .08); border-top-color: rgba(0, 0, 0, .32); animation: fade-in .2s .3s backwards, spin-it .8s linear infinite; }
    .pv-card.off { background: var(--surface-2); }
    /* paired: the code and the card's edge fade, and a check pops in where the code was */
    .pv-card.paired { background: transparent; box-shadow: 0 0 0 1px transparent, 0 14px 34px -18px transparent; }
    .pv-card.paired > svg { opacity: 0; scale: .92; }
    .pv-off { color: var(--fg3); }
    .pv-off svg { width: 44px; height: 44px; }
    .pv-done { position: relative; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--working); box-shadow: 0 12px 28px -10px color-mix(in srgb, var(--working) 70%, transparent); animation: pv-done .55s .12s var(--bounce) backwards; }
    .pv-done::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--working); opacity: 0; animation: pv-halo .9s .3s var(--out); }
    .pv-done svg { position: relative; width: 46px; height: 46px; }
    @keyframes pv-done { from { opacity: 0; scale: .3; } }
    @keyframes pv-halo { from { opacity: .35; } to { opacity: 0; scale: 1.9; } }
    .pv-line { min-height: 2.9em; margin: 14px 24px 0; text-align: center; color: var(--fg2); font-size: 13.5px; line-height: 1.45; } /* two lines kept, for an error that wraps */
    .pv-line b { color: var(--fg); font-weight: 650; }
    .pv-line.failed { color: var(--danger); }
    .pv-act { min-width: 124px; justify-content: center; } /* Copied in place of Copy code, or Try again, without a nudge */
    .pv-act[hidden] { visibility: hidden; }
    .pv-close { min-width: 78px; justify-content: center; }

    .imp-list { display: flex; flex-direction: column; gap: 8px; }
    .imp { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; transition: opacity .2s; }
    .imp.skip { opacity: .45; }
    .imp .imp-what { min-width: 0; }
    .imp .imp-what small { display: block; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .imp .imp-fields { grid-column: 3; display: flex; gap: 8px; }
    .imp input[type=text], .imp select { font: inherit; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); padding: 4px 8px; outline: 0; min-width: 0; }
    .imp input[type=text]:focus { border-color: var(--accent); }
    .imp .imp-name { font-weight: 700; width: 150px; }
    .imp .imp-folder { flex: 1; }
    .imp .imp-note { grid-column: 3; color: var(--fg3); font-size: 11.5px; }

    /* the Tasks tab counts what's waiting, in its corner: out of the layout, so the label stays centered */
    .seg.views button { position: relative; }
    .seg.views button[data-view=tasks] { padding-right: 24px; } /* room for the count in its corner */
    .seg-badge { position: absolute; top: 50%; right: 6px; margin-top: -8px; display: grid; place-items: center; min-width: 14px; height: 16px; font: 700 11px/1 var(--ui); font-style: normal; font-variant-numeric: tabular-nums; color: var(--fg3); pointer-events: none; transition: opacity .2s, transform .35s var(--spring); }
    .seg-badge:empty { opacity: 0; transform: scale(.5); }
    .seg-badge.review { color: var(--waiting-ink); }
    .tile-head .ctx { --ctx-calm: rgba(255, 255, 255, .5); --track: rgba(255, 255, 255, .14); }
    .tile-head .ctx.calm b { color: rgba(255, 255, 255, .45); }

    /* moving an agent: from one computer to another, the creature on its way between them */
    dialog.move-sheet { width: 480px; padding: 22px 24px 18px; }
    .mv-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 0 0 16px; padding: 14px 12px 12px; border-radius: var(--r-md); background: color-mix(in srgb, var(--c) 12%, var(--surface-2)); }
    .mv-pc { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; color: var(--fg2); font-size: 12px; }
    .mv-pc svg { width: 26px; height: 26px; }
    .mv-pc b { font-weight: 650; color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-pc.to { color: var(--accent); }
    .mv-path { display: flex; align-items: center; gap: 6px; }
    .mv-path i { width: 34px; height: 2px; border-radius: 1px; background: repeating-linear-gradient(90deg, var(--fg3) 0 4px, transparent 4px 8px); }
    .mv-path i:last-child { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 8px); }
    .mv-av { line-height: 0; animation: mv-hop 1.6s var(--bounce) infinite; }
    @keyframes mv-hop { 0%, 60%, 100% { transform: translateX(0); } 30% { transform: translateX(6px) translateY(-5px) rotate(4deg); } }
    dialog.move-sheet h3 { margin: 0 0 14px; }
    .mv-folder { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg2); }
    .mv-field { display: flex; gap: 8px; align-items: center; height: 36px; padding: 0 4px 0 11px; border-radius: var(--r-sm); background: var(--field); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .mv-field:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    .mv-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 13px var(--mono); color: var(--fg); user-select: text; }
    .mv-check { display: flex; align-items: center; gap: 5px; min-height: 16px; font-weight: 550; font-size: 12px; }
    .mv-check svg { width: 13px; height: 13px; stroke-width: 2.6; }
    .mv-check.ok { color: var(--working-ink); }
    .mv-check.bad { color: var(--waiting-ink); }
    .mv-sugs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 6px 0 14px; }
    .mv-sugs:empty { display: none; }
    .mv-sug { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: 999px; background: var(--btn); color: var(--fg2); font-size: 12px; font-weight: 560; cursor: pointer; transition: background .15s, color .15s; }
    .mv-sug svg { width: 13px; height: 13px; }
    .mv-sug small { font-size: 11px; font-weight: 500; color: var(--fg3); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .mv-sug:hover { background: var(--btn-hover); color: var(--fg); }
    .mv-sug.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
    .mv-carry { list-style: none; margin: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-radius: var(--r-md); background: var(--surface-2); font-size: 12.5px; color: var(--fg2); }
    .mv-carry li { display: flex; align-items: center; gap: 9px; }
    .mv-carry svg { width: 14px; height: 14px; flex: none; stroke-width: 2.6; }
    .mv-carry .yes svg { color: var(--working-ink); }
    .mv-carry .no svg { color: var(--fg3); }
    .mv-busy { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.45; color: var(--fg); background: color-mix(in srgb, var(--waiting) 12%, transparent); }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 300; max-width: min(560px, calc(100vw - 40px)); padding: 10px 16px; border-radius: 12px; background: var(--tip); color: var(--tip-fg); font-size: 13px; font-weight: 560; line-height: 1.4; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .2s, transform .35s var(--spring); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.warn { background: var(--waiting); color: #241500; }

    .chat { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .chat .feed { flex: 1; }
    /* your conversation with one agent: its header over the feed */
    .chat .convo-head { flex: none; height: 52px; padding: 0 10px 0 9px; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="tb-left"><button class="ws-switch" aria-haspopup="menu" aria-expanded="false"></button></div>
    <div class="seg views"><button data-view="crew" title="The crew: cards to open and edit each agent"></button><button data-view="tasks" title="Tasks: to do, in progress, review, done"></button><button data-view="terminals" title="Every agent's terminal"></button></div>
    <div class="tb-right">
      <button class="tb-needs hidden" data-act="needs"></button>
      <button class="icon tb-more" data-act="more" title="More: show or hide the panels, Computers, theme, config.json" aria-label="More" aria-haspopup="menu"></button>
    </div>
  </header>
  <main>
    <nav class="side">
      <div class="side-top">
        <label class="find" title="Find an agent (⌘F)"><span class="find-icon"></span><input type="search" data-find spellcheck="false" autocomplete="off"><kbd>⌘F</kbd></label>
        <button class="icon" data-act="add" title="New agent (⌘N)" aria-label="New agent"></button>
      </div>
      <div class="roster"></div>
      <div class="ws-dock hidden" role="tablist" aria-label="Workspaces"></div>
      <footer class="side-foot">
        <label class="autopilot"><span class="glyph"></span><b>Autopilot</b><input type="checkbox" class="switch sm"></label>
        <div class="foot-chips">
          <button class="foot-chip link-chip" data-act="link"></button>
          <button class="foot-chip use-chip hidden" data-act="usage" popovertarget="use-pop"></button>
        </div>
      </footer>
    </nav>
    <section class="center">
      <div class="ws-banner hidden"></div>
      <div class="terms-view hidden">
        <header class="tv-head">
          <div class="seg tv-show" data-show><button data-show="all" title="Every terminal">All <i></i></button><button data-show="busy" title="The ones working, starting or waiting on you">Busy <i></i></button><button data-show="needs" title="The ones waiting on you">Needs you <i></i></button></div>
          <span class="grow"></span>
          <div class="seg tv-layout" data-layout><button data-layout="grid" title="Every terminal side by side (⌘3)" aria-label="Grid"></button><button data-layout="focus" title="One terminal, big (⌘4)" aria-label="Focus"></button></div>
        </header>
        <div class="terms"></div>
      </div>
      <div class="collection hidden"></div>
      <div class="tasks-view hidden"></div>
      <div class="blank hidden"><span class="blank-mark"></span><b>No agents yet</b><span>Give each one a name, an area of work and a model.</span><div><button class="btn primary" data-act="add">Add your first agent</button></div></div>
    </section>
    <aside class="chat">
      <div class="convo-head"></div>
      <div class="feed"></div>
      <div class="compose"></div>
    </aside>
  </main>


  <dialog id="link" class="sheet">
    <h3><span class="h-icon"></span>Computers</h3>
    <p class="lead" title="Each agent runs on one of them; linked computers see every agent, talk to them and hand work around.">One crew across your computers, over the same Wi-Fi or Tailscale.</p>
    <div class="sheet-body link-body"></div>
    <div class="buttons"><button class="btn" data-link-add aria-pressed="false"></button><span class="grow"></span><button class="btn" data-close autofocus>Done</button></div>
    <div class="pair-view" tabindex="-1"></div>
  </dialog>
  <div class="use-pop" id="use-pop" popover></div>

  <dialog id="move" class="sheet move-sheet">
    <div class="mv-body"></div>
    <div class="buttons"><button class="btn" data-close>Cancel</button><button class="btn primary" data-mv-go>Move</button></div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>

  <dialog id="ws" class="sheet ws-sheet"></dialog>

  <dialog id="import" class="sheet">
    <h3><span class="h-icon"></span>Import agents</h3>
    <p class="lead"></p>
    <div class="sheet-body imp-list"></div>
    <p class="err" data-import-err></p>
    <div class="buttons"><button class="btn" data-close>Cancel</button><button class="btn primary" data-import-go>Import</button></div>
  </dialog>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="avatar.js"></script>
  <script src="voice.js"></script>
  <script src="common.js"></script>
  <script src="collection.js"></script>
  <script src="tasks.js"></script>
  <script src="workspaces.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
