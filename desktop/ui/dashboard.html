<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
  <title>CLIque</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="collection.css">
  <link rel="stylesheet" href="tasks.css">
  <link rel="stylesheet" href="workspaces.css">
  <link rel="stylesheet" href="setup.css">
  <style>
    html, body { height: 100%; background: var(--surface); overflow: hidden; }
    /* Two columns, like a group chat: the sidebar (the workspace, its places, and a direct conversation with each agent)
       and what's open in it (#crew, an agent's conversation with its terminal docked beside it, Agents, Tasks or
       Terminals). No titlebar: the sidebar's top and each view's header are where the window is dragged. */
    main { --rail-w: 0px; --side-w: 260px; position: relative; display: grid; grid-template-columns: var(--rail-w) var(--side-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; }
    main > .rail { grid-area: 1 / 1; } main > .side { grid-area: 1 / 2; } main > .center { grid-area: 1 / 3; }
    body.has-rail main { --rail-w: 72px; }
    @media (max-width: 1160px) { main { --side-w: 232px; } body.has-rail main { --side-w: 216px; } }
    /* the sidebar can be put away for more room (⌥⌘S): it slides out over the middle, pinned where it was (.leaving) */
    body.no-side main { --side-w: 0px; }
    body.no-side .side { visibility: hidden; overflow: hidden; }
    body.no-side .side.leaving { position: absolute; top: 0; bottom: 0; left: 0; z-index: 3; visibility: visible; pointer-events: none; }

    /* ---- the sidebar: dark in either theme, so the creatures sit on it like stickers ---- */
    :root { --side-bg: #1B1A1F; }
    @media (prefers-color-scheme: dark) { :root { --side-bg: #121115; } }
    .side {
      --fg: #EEECF1; --fg2: #B5B1BB; --fg3: #8C8893; --line: rgba(255, 255, 255, .08); --line-strong: rgba(255, 255, 255, .16);
      --fill: rgba(255, 255, 255, .07); --fill-hover: rgba(255, 255, 255, .12); --btn: var(--fill); --btn-hover: var(--fill-hover); --field: rgba(255, 255, 255, .08);
      --row-hover: rgba(255, 255, 255, .06); --row-on: rgba(255, 255, 255, .12); --ring: rgba(255, 255, 255, .55); --accent: #EEECF1; --on-accent: #1B1A1F;
      display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side-bg); color: var(--fg); color-scheme: dark;
    }
    /* a Mac's traffic lights sit in the top band; on Windows the app's mark does */
    .side-top { flex: none; height: 40px; display: flex; align-items: center; padding: 0 14px; -webkit-app-region: drag; }
    html[data-os=win] .side-top { height: 34px; }
    .app-mark { flex: none; display: grid; width: 24px; height: 18px; color: var(--fg); }
    .app-mark svg { width: 24px; height: 18px; }
    .side-ws { flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px 12px 8px; -webkit-app-region: drag; }
    .side-ws .ws-switch { flex: 1; min-width: 0; max-width: none; height: 34px; justify-content: flex-start; -webkit-app-region: no-drag; }
    .side .ws-alert { box-shadow: 0 0 0 2px var(--side-bg); }
    /* ---- the rail: every workspace, like Discord's servers, once there's more than one ----
       Its tile, a pill on its left edge (tall: on screen; short: new replies there), a berry count of what needs you
       there, and in black and white while it's parked. Drag one to move it; right-click for the rest. */
    :root { --rail-bg: #121115; }
    @media (prefers-color-scheme: dark) { :root { --rail-bg: #0B0A0D; } }
    .rail { display: none; flex-direction: column; align-items: center; min-height: 0; background: var(--rail-bg); color: #EEECF1; color-scheme: dark; }
    body.has-rail .rail { display: flex; }
    .rail-top { flex: none; align-self: stretch; height: 44px; -webkit-app-region: drag; }
    html[data-os=win] .rail-top { height: 12px; }
    .rail .ws-dock { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 2px 0 14px; overflow-y: auto; scrollbar-width: none; border: 0; }
    .rail .ws-dock::-webkit-scrollbar { display: none; }
    .rail-ws { position: relative; flex: none; width: 72px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; }
    .rail-ws .ws-tile { border-radius: 14px; transition: border-radius var(--t-move) var(--out), filter var(--t-quick); }
    .rail-ws:hover .ws-tile, .rail-ws.current .ws-tile { border-radius: 11px; }
    .rail-ws.parked .ws-tile { filter: grayscale(1); opacity: .6; }
    .rail-ws.parked:hover .ws-tile { opacity: .85; }
    .rail-pill { position: absolute; left: 0; top: 50%; width: 4px; height: 8px; margin-top: -4px; border-radius: 0 4px 4px 0; background: #fff; opacity: 0; transform: scaleY(.5); transition: opacity var(--t-quick), transform var(--t-move) var(--out); }
    .rail-ws.unread .rail-pill { opacity: 1; transform: none; }
    .rail-ws:hover .rail-pill { opacity: 1; transform: scaleY(2.5); }
    .rail-ws.current .rail-pill { opacity: 1; transform: scaleY(5); }
    .rail-ws .need-badge { position: absolute; right: 9px; bottom: -3px; min-width: 20px; height: 20px; border-radius: 10px; box-shadow: 0 0 0 3px var(--rail-bg); }
    .rail-ws.dragging { opacity: .4; }
    .rail-ws.drop-before::before, .rail-ws.drop-after::after { content: ''; position: absolute; left: 14px; right: 14px; height: 3px; border-radius: 2px; background: #EEECF1; }
    .rail-ws.drop-before::before { top: -6px; }
    .rail-ws.drop-after::after { bottom: -6px; }
    .rail-add { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 14px; background: rgba(255, 255, 255, .07); color: #B5B1BB; cursor: pointer; transition: border-radius var(--t-move) var(--out), background var(--t-quick), color var(--t-quick); }
    .rail-add:hover { border-radius: 11px; background: rgba(255, 255, 255, .13); color: #fff; }
    .rail-add svg { width: 18px; height: 18px; }
    .rail-sep { flex: none; width: 28px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .1); }
    .side-ws .ws-switch b { font-size: 15px; font-weight: 700; color: var(--fg); }
    .side-ws .ws-switch { padding-left: 8px; }
    .side-ws .ws-chev svg { transform: rotate(90deg); }
    .side-ws .ws-switch[aria-expanded=true] .ws-chev svg { transform: rotate(-90deg); }
    .side-ws .ws-chev svg { transition: transform var(--t-move) var(--out); }
    .side-ws .icon { flex: none; width: 30px; height: 30px; padding: 0; border-radius: 8px; background: var(--fill); color: var(--fg); -webkit-app-region: no-drag; }
    .side-ws .icon:hover { background: var(--fill-hover); }
    .side-ws .icon svg { width: 15px; height: 15px; }
    /* the places: #crew, Agents, Tasks, Terminals */
    .side-nav { flex: none; display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
    .nv { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--fg2); font-size: 13.5px; text-align: left; cursor: pointer; transition: background var(--t-quick), color var(--t-quick); }
    .nv:hover { background: var(--row-hover); color: var(--fg); }
    .nv[aria-current=page] { background: var(--row-on); color: #fff; font-weight: 600; }
    .nv svg { width: 16px; height: 16px; flex: none; color: var(--fg3); }
    .nv[aria-current=page] svg, .nv[aria-current=page] .hash { color: #fff; }
    .nv .hash { width: 16px; flex: none; text-align: center; font-size: 15px; font-weight: 700; color: var(--fg3); }
    .nv-n { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 500; color: var(--fg3); font-variant-numeric: tabular-nums; }
    .nv-n:empty { display: none; }
    /* the one colour: what needs you, counted */
    .need-badge { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; background: var(--needs); color: #fff; font: 700 11px/1 var(--ui); font-style: normal; font-variant-numeric: tabular-nums; }
    /* Direct: one conversation per agent. Its label turns into a search field (⌘F). */
    .side-sec { flex: none; display: flex; align-items: center; gap: 4px; height: 30px; margin: 16px 8px 2px; padding: 0 2px 0 10px; }
    .side-sec .sec-label { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--fg3); }
    .side-sec .icon { width: 26px; height: 26px; padding: 0; border-radius: 7px; color: var(--fg3); }
    .side-sec .icon:hover { color: var(--fg); background: var(--fill); }
    .side-sec .icon svg { width: 14px; height: 14px; }
    .find { flex: 1; min-width: 0; display: none; align-items: center; gap: 8px; height: 28px; margin-left: -6px; padding: 0 8px; border-radius: 7px; background: var(--field); color: var(--fg3); box-shadow: inset 0 0 0 1px var(--line-strong); }
    .find svg { width: 14px; height: 14px; flex: none; }
    .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13px; color: var(--fg); user-select: text; }
    .find input::placeholder { color: var(--fg3); }
    .find input::-webkit-search-cancel-button { display: none; }
    .side-sec.finding .find { display: flex; }
    .side-sec.finding > :not(.find) { display: none; }
    .side .roster { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; scrollbar-gutter: stable; }
    /* a computer's agents, once there's more than one computer: its name, folded on a click */
    .cg-label { display: flex; align-items: center; gap: 6px; height: 26px; margin-top: 6px; padding: 0 10px; border-radius: 7px; font-size: 11.5px; font-weight: 600; color: var(--fg3); cursor: pointer; }
    .cg-label:hover { color: var(--fg2); }
    .cg-label .chev { display: grid; width: 10px; height: 10px; transition: transform var(--t-move) var(--out); }
    .cg-label .chev svg { width: 10px; height: 10px; }
    .cgroup:not(.folded) .cg-label .chev { transform: rotate(90deg); }
    .cg-label .cg-tag { font-weight: 500; }
    .cgroup.drop-ok { border-radius: 9px; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
    .cgroup.over { background: var(--row-hover); box-shadow: inset 0 0 0 1.5px var(--fg2); }
    /* An agent: its creature, its name (and YOLO, its clones), then what needs you (berry), new replies (a quiet count)
       or how it is, in a word. Off: in black and white, dimmed. */
    .dm { position: relative; display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px 0 6px; border-radius: 8px; color: var(--fg2); font-size: 13.5px; cursor: pointer; transition: background var(--t-quick); }
    .dm:hover { background: var(--row-hover); }
    .dm.on { background: var(--row-on); color: #fff; }
    .dm.cursor { box-shadow: inset 0 0 0 1.5px var(--fg3); }
    .dm.dragging { opacity: .5; }
    .dm-av { flex: none; width: 26px; height: 26px; display: grid; place-items: center; line-height: 0; }
    .dm-name { min-width: 0; display: flex; align-items: center; gap: 6px; }
    .dm-name b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .dm.needs .dm-name b, .dm.fresh .dm-name b, .dm.on .dm-name b { color: #fff; font-weight: 600; }
    .dm .mark-yolo { flex: none; height: 15px; padding: 0 3px; border-radius: var(--r-tag); box-shadow: inset 0 0 0 1px var(--line-strong); font: 600 9.5px/15px var(--ui); font-style: normal; letter-spacing: .02em; color: var(--fg2); }
    .dm-clones { flex: none; font-size: 11.5px; font-weight: 500; color: var(--fg3); font-variant-numeric: tabular-nums; }
    .dm-end { margin-left: auto; flex: none; display: flex; align-items: center; gap: 6px; padding-left: 6px; }
    .dm-word { font-size: 12px; color: var(--fg3); white-space: nowrap; }
    .dm.on .dm-word { color: var(--fg2); }
    .dm-new { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); color: #fff; font: 600 11px/1 var(--ui); font-variant-numeric: tabular-nums; }
    .dm.off { color: var(--fg3); }
    .dm.off .dm-av { opacity: .75; }
    .roster-none { padding: 8px 10px; font-size: 13px; color: var(--fg3); }
    /* the footer: the account's usage, and ⋯ for everything else (Autopilot, Computers, theme) */
    .side-foot { flex: none; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 8px; border-top: 1px solid var(--line); }
    .use-line { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer; transition: background var(--t-quick); }
    .use-line:hover { background: var(--row-hover); color: var(--fg); }
    .use-line.none { visibility: hidden; }
    .use-bar { flex: 1; min-width: 24px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    .use-bar i { display: block; height: 100%; border-radius: 2px; background: var(--fg); }
    .use-line.warm { color: #FF8CC6; }
    .use-line.warm .use-bar i { background: var(--needs); }
    .side-more { position: relative; flex: none; width: 32px; height: 32px; padding: 0; border-radius: 8px; color: var(--fg2); }
    .side-more:hover { color: var(--fg); background: var(--row-hover); }
    .side-more svg { width: 17px; height: 17px; }
    .side-more.warn::after { content: ''; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
    /* the usage line's popover: each account's limits on a line */
    .use-pop { inset: auto; margin: 0; min-width: 220px; max-width: 320px; padding: 8px 10px; border: 0; border-radius: var(--r-card); background: var(--float); color: var(--fg); font-size: 13px; box-shadow: var(--shadow-float); }
    .use-pop:popover-open { display: flex; flex-direction: column; gap: 6px; }
    .use-pop .up-row { display: flex; flex-direction: column; gap: 2px; padding: 3px 2px; }
    .use-pop .up-row + .up-row { border-top: 1px solid var(--line); padding-top: 7px; }
    .use-pop .usage-line { display: flex; align-items: baseline; gap: 5px; font-weight: 500; }
    .use-pop .warm { color: var(--ctx-warm); }
    .use-pop .hot { color: var(--ctx-hot); }
    .use-pop small { color: var(--fg2); font-size: 12px; }
    .use-pop small.warn { color: var(--needs-ink); font-weight: 500; }
    /* ---- who works here: the workspace's agents (take one out), the rest of your crew (bring one in), a new one ---- */
    .members-pop { inset: auto; margin: 0; width: 340px; max-height: min(560px, calc(100vh - 80px)); padding: 0; border: 0; border-radius: var(--r-window); background: var(--float); color: var(--fg); box-shadow: var(--shadow-float); overflow: hidden; }
    .members-pop:focus { outline: none; }
    .members-pop:popover-open { display: flex; flex-direction: column; animation: mp-in var(--t-pop) var(--out); }
    @keyframes mp-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .mp-head { flex: none; display: flex; align-items: baseline; gap: 8px; padding: 14px 16px 6px; }
    .mp-head b { font: 600 16px/20px var(--font-brand); }
    .mp-head span { font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }
    .mp-lead { flex: none; margin: 0; padding: 0 16px 8px; font-size: 12px; line-height: 1.4; color: var(--fg2); }
    .mp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
    .mp-sec { padding: 12px 8px 4px; font-size: 12px; font-weight: 600; color: var(--fg3); }
    .mp-row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border-radius: var(--r-card); }
    .mp-row:hover { background: var(--fill); }
    .mp-row .av { flex: none; }
    .mp-who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .mp-who b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-who small { font-size: 12px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-row .btn { flex: none; min-height: 26px; padding: 0 10px; font-size: 12px; }
    .mp-row .mp-take { opacity: 0; }
    .mp-row:hover .mp-take, .mp-take:focus-visible { opacity: 1; }
    .mp-only { flex: none; font-size: 11px; color: var(--fg3); }
    .mp-foot { flex: none; display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
    .mp-foot .btn { min-height: 30px; }
    .mp-foot .btn svg { width: 14px; height: 14px; }

    /* ---- what's open: the place's header (common.css .page-head) over the view ---- */
    .center { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
    /* Windows draws its window buttons over the top right (main.js titleBarOverlay, 45px tall): nothing goes beneath
       them. The width they take comes from the page (titlebar-area), 138px if it can't say. */
    .center { --caption-w: 0px; }
    html[data-os=win] .center { --caption-w: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, calc(100vw - 138px))); }
    /* with the sidebar put away, a Mac's traffic lights sit over the header's left end */
    html:not([data-os=win]) body.no-side .center { --lights-w: 76px; }
    /* the views' gutter: the header's title and what's under it line up (a narrow middle takes less) */
    @media (max-width: 960px) { .heads, .stage { --gx: 16px; } }
    .heads { flex: none; }
    .page-head.none { display: none; }
    /* a conversation's header: its switch, and the agent's YOLO next to its name as everywhere else */
    .mh-power { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--r-control); font-size: 13px; color: var(--fg2); cursor: pointer; }
    .mh-power:hover { background: var(--fill); }
    .ph-tools .mode { height: 22px; }
    /* #crew: what's waiting on you (a berry pill that jumps to the oldest), and who's in it */
    .mh-needs { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--needs-tint); color: var(--needs-ink); font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: background var(--t-quick); animation: mh-in var(--t-move) var(--out); }
    .mh-needs:hover { background: color-mix(in srgb, var(--needs) 16%, transparent); }
    .mh-needs svg { width: 12px; height: 12px; }
    @keyframes mh-in { from { opacity: 0; } }
    .mh-faces { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 4px; border: 0; border-radius: var(--r-control); background: none; color: var(--fg2); font: inherit; font-size: 13px; cursor: pointer; }
    .mh-faces:hover { background: var(--fill); color: var(--fg); }
    .mh-faces .av + .av { margin-left: -7px; }
    /* the words found, in the results */
    .chat mark { background: color-mix(in srgb, var(--accent) 14%, transparent); color: inherit; border-radius: 3px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 14%, transparent); }
    .chat .feed.searching .item, .chat .feed.searching .task-ev, .chat .feed.searching .event { cursor: pointer; }
    .chat .feed.searching .item:hover { background: var(--fill); border-radius: var(--r-card); box-shadow: 0 0 0 6px var(--fill); }
    .chat .feed .empty > svg { width: 28px; height: 28px; opacity: 1; }

    .stage { position: relative; flex: 1; min-height: 0; }
    .center > .ws-banner { position: relative; inset: auto; flex: none; margin: 10px 14px 2px; } /* above what's open, never over it */
    .stage > * { position: absolute; inset: 0; }
    .collection, .tasks-view { overflow: hidden; }
    /* Grid: tiles stay tall enough to read (a dozen lines or so) and the grid scrolls, rather than squeezing
       every terminal down to three lines. Two columns once there's room for two full-width terminals. */
    .terms-view { position: absolute; inset: 0; display: flex; flex-direction: column; }
    /* in Focus the filter waits for the grid; a click on it goes back there */
    .tv-show.idle { opacity: .55; }
    .tv-show.idle:hover { opacity: 1; }
    .tv-show [data-show=needs] .n.some { color: var(--needs-ink); }
    .terms { position: relative; flex: 1; min-height: 0; padding: 20px var(--gx, 24px) var(--gx, 24px); display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); grid-auto-rows: minmax(250px, 1fr); overflow-y: auto; }
    .terms.focus { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); overflow: hidden; }
    .terms.focus .tile:not(.on) { display: none; }
    .terms .tile.filtered { display: none; }
    /* nobody busy, nobody waiting: a line where the terminals would be (common.css .empty-state.small) */
    .terms-none { grid-column: 1 / -1; align-self: center; justify-self: center; }
    .terms-view:not(.hidden) .tile { animation: tile-in var(--t-move) var(--out) backwards; animation-delay: calc(min(sibling-index(), 10) * 20ms); }
    @keyframes tile-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
    /* terminals stay dark in light mode, so their headers carry dark tokens */
    .tile { --c: #888; --fg: #EDEDED; --fg2: #A0A0A0; --fg3: #6E6E6E; --line: rgba(255, 255, 255, 0.08); --line-strong: rgba(255, 255, 255, 0.14); --fill: rgba(255, 255, 255, 0.06); --fill-hover: rgba(255, 255, 255, 0.10); --btn: rgba(255, 255, 255, 0.06); --btn-hover: rgba(255, 255, 255, 0.10); --working-ink: #BDBDBD; --needs: #E0458F; --needs-ink: #FF7AC0; --waiting-ink: #FF7AC0; --starting: #A0A0A0; --yolo-ink: #A0A0A0; --fast-ink: #A0A0A0; color: var(--fg); }
    .tile { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: #111; border-radius: var(--r-card); overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06); transition: box-shadow .25s; }
    @media (prefers-color-scheme: light) { .tile { box-shadow: 0 0 0 1px rgba(0, 0, 0, .14); } }
    .tile.on { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
    /* a terminal that's waiting on you says so with its outline (and its Answer button) */
    .tile.needs, .tile.needs.on { box-shadow: 0 0 0 2px var(--needs); }
    /* One header row: who, how it is, its model; then its helpers and what this view is (LIVE, MIRROR…). A narrow tile
       lets the model word go first (it's in the badge's tooltip too). */
    .tile { container-type: inline-size; }
    @container (max-width: 360px) { .tile-head { gap: 6px; } .tile-head .ctx b { display: none; } }
    /* YOLO and Fast show on a roomy tile (Focus, a wide grid); a narrow one keeps its model word instead, and the marks
       stay on the agent's row and card */
    .tile-head .mark-yolo, .tile-head .mark-fast, .tile-head .mark-holds { flex: none; }
    @container (max-width: 480px) { .tile-head .mark-yolo, .tile-head .mark-fast, .tile-head .mark-holds { display: none; } }
    .tile-head { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 10px; min-width: 0; white-space: nowrap; background: #1a1a1a; }
    .tile-head .tile-av { position: relative; flex: none; line-height: 0; margin-right: -1px; }
    .tile-head .t-name { flex: none; font: 600 14px/18px var(--font-brand); }
    .tile-head .t-home { font-weight: 500; color: var(--fg3); }
    .tile-head .t-mid { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; height: 18px; overflow: hidden; line-height: 18px; }
    .tile-head .t-state { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--fg2); }
    .tile-head .t-state.waiting { color: var(--needs-ink); font-weight: 500; }
    .tile-head .t-state.stopped, .tile-head .t-state.away { color: var(--fg3); }
    .tile-head .t-state[data-act] { cursor: pointer; }
    .tile-head .t-model { flex: none; font-size: 12px; color: var(--fg3); }
    .t-chip { flex: none; display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 6px 0 4px; border-radius: var(--r-tag); background: var(--btn); color: var(--fg2); font: 500 11px/1 var(--ui); font-variant-numeric: tabular-nums; cursor: help; }
    .t-chip svg { width: 12px; height: 12px; }
    .t-chip.clones { padding-left: 2px; }
    .t-chip .av + .av { margin-left: -7px; }
    /* What this view is. These aren't terminal apps: the badge says whether typing reaches the agent right now (LIVE, or
       MIRROR from another computer), or that it's being redrawn (REPLAY), or frozen (OFFLINE, ENDED). See tileMode(). */
    /* the badge keeps its words (Live, Mirror, Replay, Offline, Ended) as a quiet outlined tag; only Live has a green dot */
    .t-badge { --rb: var(--fg2); flex: none; display: inline-flex; align-items: center; gap: 5px; height: 16px; padding: 0 5px; border-radius: var(--r-tag); font: 500 11px/1 var(--ui); color: var(--rb); box-shadow: inset 0 0 0 1px var(--line-strong); cursor: help; }
    .t-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .t-badge[data-mode=live]::before { background: var(--working-ink); }
    .t-badge[data-mode=offline] { --rb: var(--needs-ink); }
    .t-answer { flex: none; height: 24px; padding: 0 10px; border: 0; border-radius: var(--r-control); background: var(--needs); color: #241500; font-weight: 500; font-size: 12px; cursor: pointer; transition: background .15s; }
    .t-answer:hover { background: color-mix(in srgb, var(--needs) 88%, #fff); }
    /* the four actions float over the terminal's corner: on hover, and on the one picked. Out of the header, so it
       never shifts. */
    .tile-acts { position: absolute; top: 46px; right: 8px; z-index: 2; display: flex; gap: 1px; padding: 2px; border-radius: var(--r-control); background: #262626; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 8px 24px rgba(0, 0, 0, .48); opacity: 0; pointer-events: none; transition: opacity .15s; }
    .tile:hover .tile-acts, .tile.on .tile-acts, .tile-acts:focus-within { opacity: 1; pointer-events: auto; }
    .tile-acts .icon { width: 28px; height: 28px; padding: 0; color: rgba(255, 255, 255, .6); }
    .tile-acts .icon:hover { color: #fff; background: rgba(255, 255, 255, .1); }
    .tile-acts .icon svg { width: 14px; height: 14px; }
    .tile-acts [data-act=fresh][aria-pressed=true] { color: #fff; background: rgba(255, 255, 255, .2); }
    /* frozen output looks frozen */
    .tile[data-mode=offline] .term, .tile[data-mode=ended] .term { opacity: .5; filter: grayscale(.7); transition: opacity .3s; }
    .term { flex: 1; min-height: 0; padding: 6px 0 2px 10px; }
    /* no agents, all off, or a parked workspace: over the terminals (common.css .empty-state, the mark as its art) */
    .blank > svg.mark { width: 84px; height: 56px; color: var(--fg3); }

    /* ---- sheets: Computers, Move, Import, a workspace's (workspaces.css) and Add a provider (setup.css) are one family:
       the title in the brand face (common.css .sheet-title) over one grey line, what's in it, and its buttons along a
       footer as wide as the sheet (.sheet-foot), the one that does it at the right end. × (.sheet-x) where it has one. */
    dialog.sheet { width: 600px; max-height: calc(100vh - 80px); border: 0; border-radius: var(--r-window); padding: 20px 24px 0; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-float); }
    dialog.sheet[open] { display: flex; flex-direction: column; }
    dialog.sheet .sheet-body { overflow-y: auto; min-height: 0; margin: 0 -6px; padding: 0 6px; }
    dialog.sheet .lead { margin: 4px 0 16px; font-size: 13px; line-height: 1.45; color: var(--fg2); }
    dialog.sheet .sheet-foot { margin: 16px -24px 0; }
    dialog.sheet .err { min-height: 0; margin: 4px 0 0; font-size: 13px; color: var(--danger); }
    /* fields in a sheet are common.css .field; the agent's name in Computers turns into one while you edit it */
    .me-name:focus { box-shadow: var(--focus-ring); }
    /* Computers: grouped rows (This Mac, Linked, Phones: common.css .section-label over a .group-list), each a line of
       plain words with its control on the right. Details fold away: the addresses behind one row, each linked
       computer's agents behind its chevron. */
    #link { margin: 40px auto auto; } /* top-anchored: unfolding a row grows the sheet downwards, so the row stays under the hand */
    #link .lead { margin-bottom: 12px; }
    .link-body .section-label:not(:first-child) { margin-top: 16px; }
    .link-body .err:empty { display: none; }
    .lk-li { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 8px 14px 8px 16px; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
    .lk-k { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 13px; font-weight: 500; }
    .lk-k small { font-size: 12px; font-weight: 400; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lk-k small .dot { width: 7px; height: 7px; margin-right: 5px; vertical-align: 0; }
    .lk-ic { flex: none; width: 32px; height: 32px; border-radius: var(--r-control); display: grid; place-items: center; background: var(--fill); color: var(--fg2); }
    .lk-ic svg { width: 18px; height: 18px; }
    .lk-sw { cursor: pointer; }
    .lk-note { flex: 1; min-width: 0; margin: 0; font-size: 13px; line-height: 1.45; color: var(--fg2); }
    .lk-copy { min-width: 150px; } /* Copied fits in place of Copy link code, without a nudge */
    .lk-chev { flex: none; width: 14px; height: 14px; color: var(--fg3); transition: transform var(--t-move) var(--out); }
    .lk-chev svg { display: block; width: 14px; height: 14px; }
    [aria-expanded=true] > .lk-chev { transform: rotate(90deg); }
    button.lk-li { cursor: pointer; transition: background .15s; }
    button.lk-li:hover { background: color-mix(in srgb, var(--fg) 3%, transparent); }
    .lk-more { min-height: 44px; font-size: 13px; color: var(--fg2); }
    .lk-more > span:first-child { flex: 1; }
    /* a computer or a phone that just joined */
    .lk-pc.fresh, .lk-phone.fresh { border-radius: var(--r-card); box-shadow: 0 0 0 2px var(--accent); }
    .lk-body { padding: 0 14px 12px 16px; }
    .lk-body > p { margin: 0 0 8px; font-size: 13px; color: var(--fg2); line-height: 1.45; }
    .lk-details { display: block; padding: 10px 14px 12px 16px; font-size: 13px; color: var(--fg2); }
    .lk-details p { margin: 0 0 8px; line-height: 1.45; }
    .lk-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--fg2); }
    .lk-btns { flex: none; display: flex; gap: 6px; }
    .lk-empty { font-size: 13px; color: var(--fg2); min-height: 48px; }
    .lk-form { display: block; padding: 12px 14px 12px 16px; }
    .lk-form p { margin: 0; font-size: 13px; color: var(--fg2); line-height: 1.45; }
    #link [data-link-add][aria-pressed=true] { background: var(--fill-hover); }
    .code-in { display: flex; gap: 8px; align-items: stretch; margin-top: 10px; }
    .code-in textarea { flex: 1; resize: none; border-radius: var(--r-card); padding: 8px 10px; font: 11.5px var(--mono); user-select: text; }
    /* this computer's name, renamed where it is: a field only while you point at it or type in it */
    .me-name { width: 230px; max-width: 100%; margin: -2px 0 -1px -7px; padding: 2px 7px; border: 0; border-radius: var(--r-control); outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; transition: background var(--t-quick), box-shadow var(--t-quick); }
    .me-name:hover { background: var(--fill); }
    .me-name:focus { background: var(--field); }
    .lk-agents { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .lk-agents li { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: var(--r-card); }
    .lk-agents li:hover { background: var(--btn); }
    .lk-agents li.unused .av, .lk-agents li.unused .who { opacity: .45; }
    .lk-agents .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .lk-agents .who small { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lk-move { opacity: 0; transition: opacity var(--t-quick); }
    .lk-agents li:hover .lk-move, .lk-move:focus-visible { opacity: 1; }
    .lk-agents .use { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); cursor: pointer; }
    /* phones: what they're for and Add a phone, then a row per paired phone, as the computers' rows */
    .ph-seen { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); white-space: nowrap; }
    /* Add a phone: the dialog becomes one view about pairing. The code sits high and big on a white card (its quiet
       zone, whatever the theme), one line under it, and the buttons where the list's are. Nothing in it changes size:
       a new code, an error or a phone that paired only change what's on the card and the line. */
    #link.pairing > :not(.pair-view), #link:not(.pairing) > .pair-view { display: none; }
    .pair-view { display: flex; flex-direction: column; animation: pv-in var(--t-move) var(--out); }
    .pair-view:focus-visible { outline: none; }
    #link.back > :not(.pair-view) { animation: pv-back var(--t-move) var(--out); }
    @keyframes pv-in { from { opacity: 0; transform: translateX(14px); } }
    @keyframes pv-back { from { opacity: 0; transform: translateX(-14px); } }
    .pair-view .sheet-title { margin-bottom: 18px; }
    .pv-card { align-self: center; display: grid; place-items: center; width: var(--card); height: var(--card); border-radius: var(--r-window); background: #fff; box-shadow: 0 0 0 1px var(--line); transition: background .4s var(--out), box-shadow .4s var(--out); }
    .pv-card > * { grid-area: 1 / 1; }
    .pv-card > svg { display: block; width: var(--qr); height: var(--qr); transition: opacity .25s, scale .35s var(--out); }
    /* still making the first code: a spinner, only if that takes a moment */
    .pv-card.wait::after { content: ''; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(0, 0, 0, .08); border-top-color: rgba(0, 0, 0, .32); animation: fade-in .2s .3s backwards, spin-it .8s linear infinite; }
    .pv-card.off { background: var(--surface-2); }
    /* paired: the code and the card's edge fade, and a check pops in where the code was */
    .pv-card.paired { background: transparent; box-shadow: 0 0 0 1px transparent; }
    .pv-card.paired > svg { opacity: 0; scale: .92; }
    .pv-off { color: var(--fg3); }
    .pv-off svg { width: 44px; height: 44px; }
    .pv-done { position: relative; width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--working); animation: pv-done .45s .12s var(--out) backwards; }
    .pv-done::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--working); opacity: 0; animation: pv-halo .9s .3s var(--out); }
    .pv-done svg { position: relative; width: 46px; height: 46px; }
    @keyframes pv-done { from { opacity: 0; scale: .3; } }
    @keyframes pv-halo { from { opacity: .35; } to { opacity: 0; scale: 1.9; } }
    .pv-line { min-height: 2.9em; margin: 14px 24px 0; text-align: center; color: var(--fg2); font-size: 13px; line-height: 1.45; } /* two lines kept, for an error that wraps */
    .pv-line b { color: var(--fg); font-weight: 600; }
    .pv-line.failed { color: var(--danger); }
    .pv-act { min-width: 124px; } /* Copied in place of Copy code, or Try again, without a nudge */
    .pv-act[hidden] { visibility: hidden; }
    .pv-close { min-width: 78px; }

    /* Import: a row per agent in the file (common.css .group-list); one left out fades, its switch stays clear */
    .imp { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 14px 10px 16px; }
    .imp > * { transition: opacity .2s; }
    .imp.skip > :not(.switch) { opacity: .45; }
    .imp .imp-what { min-width: 0; }
    .imp .imp-what small { display: block; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .imp .imp-fields { grid-column: 3; display: flex; gap: 8px; }
    .imp input[type=text], .imp select { min-width: 0; height: 28px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--fg); }
    .imp .imp-name { font-weight: 500; width: 150px; }
    .imp .imp-folder { flex: 1; }

    .tile-head .ctx { --ctx-calm: rgba(255, 255, 255, .5); --track: rgba(255, 255, 255, .14); }
    .tile-head .ctx.calm b { color: rgba(255, 255, 255, .45); }

    /* moving an agent: from one computer to another, the creature on its way between them */
    dialog.move-sheet { width: 480px; }
    .mv-route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin: 16px 0; padding: 14px 12px 12px; border-radius: var(--r-card); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
    .mv-pc { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; color: var(--fg2); font-size: 12px; }
    .mv-pc svg { width: 26px; height: 26px; }
    .mv-pc b { font-weight: 500; color: var(--fg); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mv-pc.to { color: var(--fg); }
    .mv-path { display: flex; align-items: center; gap: 6px; }
    .mv-path i { width: 34px; height: 2px; border-radius: 1px; background: repeating-linear-gradient(90deg, var(--fg3) 0 4px, transparent 4px 8px); }
    .mv-path i:last-child { background: repeating-linear-gradient(90deg, var(--fg2) 0 4px, transparent 4px 8px); }
    .mv-av { line-height: 0; }
    .mv-folder { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--fg2); }
    /* a folder field with Choose… inside it (here, and a workspace's folder in workspaces.css) */
    .mv-field { display: flex; gap: 8px; align-items: center; height: 32px; padding: 0 2px 0 8px; }
    .mv-field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 13px var(--mono); color: var(--fg); user-select: text; }
    .mv-check { display: flex; align-items: center; gap: 5px; min-height: 16px; font-weight: 500; font-size: 12px; }
    .mv-check svg { width: 13px; height: 13px; stroke-width: 2.6; }
    .mv-check.ok { color: var(--working-ink); }
    .mv-check.bad { color: var(--needs-ink); }
    .mv-sugs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 6px 0 14px; }
    .mv-sugs:empty { display: none; }
    .mv-sug { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border: 0; border-radius: var(--r-control); background: var(--btn); color: var(--fg2); font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; }
    .mv-sug svg { width: 13px; height: 13px; }
    .mv-sug small { font-size: 11px; font-weight: 400; color: var(--fg2); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .mv-sug:hover { background: var(--btn-hover); color: var(--fg); }
    .mv-sug.on { color: var(--fg); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--accent); }
    .mv-carry { list-style: none; margin: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-radius: var(--r-card); background: var(--surface-2); font-size: 13px; color: var(--fg2); }
    .mv-carry li { display: flex; align-items: center; gap: 9px; }
    .mv-carry svg { width: 14px; height: 14px; flex: none; stroke-width: 2.6; }
    .mv-carry .yes svg { color: var(--working-ink); }
    .mv-carry .no svg { color: var(--fg3); }
    .mv-busy { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--r-control); font-size: 13px; line-height: 1.45; color: var(--fg); background: var(--needs-tint); }

    /* ---- the chat: #crew (everyone), or your conversation with one agent ----
       Messages across the window, down the left like a group chat: each sender's creature beside what it said, you
       included. What needs you is a card in the conversation (760px at most, as wide as the lines of who's at work),
       answered where it is. */
    .chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
    .chat .feed { flex: 1; gap: 14px; padding: 20px var(--gx, 24px) 12px; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12px); }
    .chat .composer { padding: 6px var(--gx, 24px) 18px; }
    .chat .needs-queue { display: none !important; }
    .chat .item.said { gap: 12px; }
    .chat .item.said .face { width: 36px; }
    .chat .item .cap { margin-bottom: 1px; font-size: 12px; }
    .chat .item .cap .who, .chat .item .cap .you { font-size: 14px; font-weight: 700; color: var(--fg); }
    .chat .item .cap .to { color: var(--fg3); }
    .chat .bubble { font-size: 14px; line-height: 1.5; }
    .chat .item.mine .stack > .bubble { background: none; padding: 0; border-radius: 0; }
    .chat .item.cont { margin-top: -10px; }
    .you-av { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--fg); color: var(--surface); font: 600 11px/1 var(--ui); letter-spacing: .01em; }
    .chat .event, .chat .rule-ev { align-self: flex-start; margin-left: 48px; text-align: left; }
    .chat .fresh-ev, .chat .task-ev { margin-left: 48px; }
    .chat .ask-card { width: min(760px, 100%); margin-top: 6px; padding: 14px 16px; border-radius: 14px; }
    .chat .item.ask.open .ask-card { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--needs) 62%, transparent); }
    .chat .item.ask.open .ask-title svg { color: var(--needs-ink); }
    .chat .typing-row { margin-left: 48px; }
    .chat .typing-row, .chat .sub-tree { max-width: 760px; } /* the line stays near its words: its dots and steps don't drift to the far edge */
    .chat .typing-row .tr-what { flex: 0 1 auto; }
    /* a question's options: one line each, its words after its label, so a card stays a glance tall */
    .chat .ask-options { gap: 4px; }
    .chat .ask-option { flex-direction: row; align-items: baseline; gap: 10px; padding: 7px 34px 7px 12px; }
    .chat .ask-option b { flex: none; }
    .chat .ask-option span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat .ask-other { margin-top: 6px; }
    .chat .ask-question { margin: 4px 0 10px; font-size: 14px; }
    .chat .convo-empty b { font-family: var(--font-brand); font-size: 18px; }
    /* an empty #crew: what's there to do first, like Discord's welcome to a new server */
    .chat .feed .welcome { margin: auto; width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; user-select: none; }
    .welcome .ws-tile { margin-bottom: 10px; }
    .welcome h2 { margin: 0; font: 600 26px/32px var(--font-brand); color: var(--fg); }
    .welcome > p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: var(--fg2); }
    .wl-steps { align-self: stretch; display: flex; flex-direction: column; gap: 6px; }
    .wl-step { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border: 0; border-radius: var(--r-card); background: var(--fill); color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: background var(--t-quick); }
    .wl-step:hover { background: var(--fill-hover); }
    .wl-step > span { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .wl-step b { font-weight: 600; font-size: 13px; }
    .wl-step small { font-size: 12px; color: var(--fg2); }
    .wl-mark { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--fg3); }
    .wl-step.done .wl-mark { background: var(--accent); color: var(--on-accent); box-shadow: none; }
    .wl-mark svg { width: 12px; height: 12px; }
    .wl-go { flex: none; width: 14px; height: 14px; color: var(--fg3); }

    /* ---- an agent's terminal, docked beside your conversation with it ----
       The same terminal as in Terminals (one per agent, moved by CSS, never re-created): tabs for it and its clones,
       what kind of view it is (Live, Mirror…), and a way to put it away. */
    .stage { --dock-w: clamp(340px, 46%, 660px); }
    .stage.docked .chat { right: var(--dock-w); }
    .terms-view.docked { left: auto; width: var(--dock-w); padding: 10px 10px 10px 0; }
    .dock-bar { display: none; }
    .terms-view.docked .dock-bar { flex: none; display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 6px 0 8px; border-radius: var(--r-window) var(--r-window) 0 0; background: #1a1a1a; color: #EDEDED; box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); }
    .dock-tabs { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .dock-tab { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border: 0; border-radius: 7px; background: none; color: #A0A0A0; font: 500 12.5px/1 var(--ui); cursor: pointer; transition: background var(--t-quick), color var(--t-quick); }
    .dock-tab:hover { color: #EDEDED; background: rgba(255, 255, 255, .06); }
    .dock-tab[aria-selected=true] { color: #fff; background: rgba(255, 255, 255, .11); }
    .dock-tab .need-badge { min-width: 16px; height: 16px; font-size: 10px; }
    .dock-bar .t-badge { margin: 0 4px; }
    .dock-bar .icon { width: 28px; height: 28px; padding: 0; color: rgba(255, 255, 255, .6); }
    .dock-bar .icon:hover { color: #fff; background: rgba(255, 255, 255, .1); }
    .dock-bar .icon svg { width: 14px; height: 14px; }
    .terms-view.docked .terms { padding: 0; overflow: hidden; }
    .terms-view.docked .tile { border-radius: 0 0 var(--r-window) var(--r-window); box-shadow: 0 0 0 1px rgba(0, 0, 0, .06); animation: none; }
    .terms-view.docked .tile-head { display: none; }
    .terms-view.docked .tile-acts { top: 8px; }
    .terms-view.docked .tile.on:not(:hover) .tile-acts:not(:focus-within) { opacity: 0; pointer-events: none; } /* over the output: only while the pointer's there */
    .terms-view.docked .term { padding-top: 10px; }
  </style>
</head>
<body>
  <main>
    <nav class="rail" aria-label="Workspaces">
      <div class="rail-top"></div>
      <div class="ws-dock" role="tablist" aria-label="Workspaces" aria-orientation="vertical"></div>
    </nav>
    <nav class="side" aria-label="Places and agents">
      <div class="side-top"></div>
      <div class="side-ws">
        <button class="ws-switch" aria-haspopup="menu" aria-expanded="false"></button>
        <button class="icon" data-act="add" title="New agent (⌘N)" aria-label="New agent"></button>
      </div>
      <div class="side-nav">
        <button class="nv" data-place="chat" title="Everyone's messages: Auto picks who answers (⌘1)"><span class="hash" aria-hidden="true">#</span><span>crew</span><i class="nv-n"></i></button>
        <button class="nv" data-place="crew" title="Every agent as a card: turn them on and off, edit, compare (⌘2)"><span class="nv-icon"></span><span>Agents</span><i class="nv-n"></i></button>
        <button class="nv" data-place="tasks" title="Tasks: to do, in progress, review, done (⌘3)"><span class="nv-icon"></span><span>Tasks</span><i class="nv-n"></i></button>
        <button class="nv" data-place="terminals" title="Every agent's terminal (⌘4)"><span class="nv-icon"></span><span>Terminals</span><i class="nv-n"></i></button>
      </div>
      <div class="side-sec">
        <span class="sec-label">Direct</span>
        <button class="icon" data-act="find" title="Find an agent (⌘K)" aria-label="Find an agent"></button>
        <label class="find"><span class="find-icon"></span><input type="search" data-find spellcheck="false" autocomplete="off" aria-label="Find an agent"></label>
      </div>
      <div class="roster"></div>
      <footer class="side-foot">
        <button class="use-line none" data-act="usage" popovertarget="use-pop"></button>
        <button class="icon side-more" data-act="more" title="Autopilot, Computers, Claude Code and Codex, theme" aria-label="More" aria-haspopup="menu"></button>
      </footer>
    </nav>
    <section class="center">
      <div class="heads">
        <header class="page-head" data-for="chat"><div class="ph-title"></div><div class="ph-tools"><div class="chat-search"></div><span class="ph-acts"></span></div></header>
      </div>
      <div class="ws-banner hidden"></div>
      <div class="stage">
        <aside class="chat" aria-label="Messages">
          <div class="feed"></div>
          <div class="compose"></div>
        </aside>
        <div class="terms-view hidden">
          <div class="dock-bar"></div>
          <div class="terms"></div>
        </div>
        <div class="collection hidden"></div>
        <div class="tasks-view hidden"></div>
        <div class="blank empty-state hidden"><span class="blank-mark"></span><h1 class="display">No agents yet</h1><p class="lead">Give each one a name, an area of work and a model.</p><div class="acts"><button class="btn primary lg" data-act="add">Add your first agent</button></div></div>
      </div>
    </section>
  </main>


  <dialog id="link" class="sheet">
    <h2 class="sheet-title"><span class="h-icon"></span>Computers</h2>
    <p class="lead" title="Each agent runs on one of them; linked computers see every agent, talk to them and hand work around.">One crew across your computers, over the same Wi-Fi or Tailscale.</p>
    <div class="sheet-body link-body"></div>
    <div class="sheet-foot"><button class="btn" data-link-add aria-pressed="false"></button><span class="grow"></span><button class="btn" data-close autofocus>Done</button></div>
    <div class="pair-view" tabindex="-1"></div>
  </dialog>
  <div class="use-pop" id="use-pop" popover></div>
  <div class="members-pop" id="members-pop" popover tabindex="-1" role="dialog" aria-label="Who works here"></div>

  <dialog id="move" class="sheet move-sheet">
    <div class="mv-body"></div>
    <div class="sheet-foot"><span class="grow"></span><button class="btn" data-close>Cancel</button><button class="btn primary" data-mv-go>Move</button></div>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>

  <dialog id="ws" class="sheet ws-sheet"></dialog>

  <dialog id="import" class="sheet">
    <h2 class="sheet-title"><span class="h-icon"></span>Import agents</h2>
    <p class="lead"></p>
    <div class="sheet-body"><div class="group-list imp-list"></div></div>
    <p class="err" data-import-err></p>
    <div class="sheet-foot"><span class="grow"></span><button class="btn" data-close>Cancel</button><button class="btn primary" data-import-go>Import</button></div>
  </dialog>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="avatar.js"></script>
  <script src="voice.js"></script>
  <script src="common.js"></script>
  <script src="brand.js"></script>
  <script src="collection.js"></script>
  <script src="tasks.js"></script>
  <script src="workspaces.js"></script>
  <script src="setup.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
