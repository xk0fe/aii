<!doctype html>
<!-- The README cover: the wordmark, one line in the brand face, and the clique on the stage's glow, each acting out what
     it's doing (the app's own CSS, avatar.js and brand.js, with the demo clique and Q). Rendered by
     `npm run shots -- cover` at 1280×600, in both themes, with see-through corners. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/common.css">
  <style>
    html, body { width: 1280px; height: 600px; overflow: hidden; background: transparent !important; }
    .cover { position: relative; width: 1280px; height: 600px; border-radius: 32px; overflow: hidden; background: var(--bg); color: var(--fg); }
    .wm { position: absolute; left: 60px; top: 44px; }
    h1 { position: absolute; left: 64px; top: 126px; margin: 0; font: 600 60px/64px var(--font-brand); letter-spacing: -.01em; }
    h1 em { font-style: normal; color: var(--needs); }
    .lead { position: absolute; left: 66px; top: 270px; margin: 0; max-width: 640px; font-size: 21px; line-height: 30px; color: var(--fg2); }
    .free { position: absolute; right: 64px; top: 64px; font-size: 16px; color: var(--fg2); }
    /* the stage: the first run's glow under everyone, as wide as the cover */
    .room { position: absolute; left: 0; right: 0; top: 344px; height: 212px; }
    .room .glowbed { inset: -40px 0 -70px; }
    .room .glowbed i { filter: blur(64px); }
    .room .glowbed b { display: none; }
    .clique { position: absolute; left: 40px; right: 40px; bottom: 0; display: flex; justify-content: space-around; align-items: flex-end; }
    .clique > span { line-height: 0; }
    .names { position: absolute; left: 40px; right: 40px; top: 562px; display: flex; justify-content: space-around; }
    .names span { width: 120px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 17px/22px var(--font-brand); color: var(--fg2); }
    .names .dot { width: 9px; height: 9px; }
    .bubble-say { position: absolute; z-index: 3; padding: 9px 14px; border-radius: 12px; border-bottom-left-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 16px; line-height: 22px; white-space: nowrap; }
    .bubble-say code { font: 15px var(--mono); background: none; padding: 0; }
    @media (prefers-color-scheme: dark) {
      h1 em { color: var(--needs-ink); }
    }
  </style>
</head>
<body>
  <div class="cover">
    <span class="wm" id="wm"></span>
    <span class="free">Free. Bring your own Claude or Codex account.</span>
    <h1>Your AI agents,<br>working as a <em>clique</em></h1>
    <p class="lead">Claude Code and Codex agents with names, jobs and one chat for all of them. They split the work, and ask when they need you.</p>
    <div class="room" id="room"></div>
    <div class="names" id="names"></div>
  </div>
  <script src="../ui/avatar.js"></script>
  <script src="../ui/common.js"></script>
  <script src="../ui/brand.js"></script>
  <script>
    // Q and the demo clique (screenshot-preload.cjs), each in the pose its status gives it
    const clique = [
      ['Q', 'idle', { body: 'bean', color: 'pink', eyes: 'sparkle', mouth: 'smile', hat: 'none', cheeks: true }],
      ['Ada', 'working', { body: 'blob', color: 'mint', eyes: 'dot', mouth: 'none', hat: 'glasses', cheeks: false }],
      ['Milo', 'waiting', { body: 'cat', color: 'sky', eyes: 'happy', mouth: 'cat', hat: 'party', cheeks: true }, 'permission'],
      ['Iris', 'waiting', { body: 'heart', color: 'pink', eyes: 'sparkle', mouth: 'smile', hat: 'flower', cheeks: true }, 'question'],
      ['Theo', 'working', { body: 'frog', color: 'lime', eyes: 'googly', mouth: 'grin', hat: 'none', cheeks: false }],
      ['June', 'idle', { body: 'bunny', color: 'peach', eyes: 'happy', mouth: 'smile', hat: 'bow', cheeks: true }],
      ['Rex', 'starting', { body: 'mochi', color: 'yellow', eyes: 'dot', mouth: 'smile', hat: 'headphones', cheeks: true }],
      ['Noor', 'off', { body: 'drop', color: 'purple', eyes: 'googly', mouth: 'cat', hat: 'beret', cheeks: false }],
    ].map(([name, status, avatar, ask]) => ({ name, status, avatar, ask, on: status !== 'off' }))
    const draw = () => {
      document.getElementById('wm').innerHTML = wordmarkHTML(64)
    }
    draw()
    const room = document.getElementById('room')
    room.innerHTML = `${glowBedHTML()}<div class="clique">${clique.map((a) => `<span>${avatarHTML(a, { size: 116, pose: poseOf(a, { ask: a.ask }) })}</span>`).join('')}</div>`
    document.getElementById('names').innerHTML = clique.map((a) => `<span>${a.status === 'working' || a.status === 'waiting' ? `<i class="dot ${a.status === 'waiting' ? 'needs' : 'working'}"></i>` : ''}${a.name}</span>`).join('')
    // two of them talking: Milo asks, Theo reports
    room.insertAdjacentHTML('beforeend', '<span class="bubble-say" style="left:452px;top:10px">Can I run <code>npm run build</code>?</span><span class="bubble-say" style="left:742px;top:36px">All 48 checkout tests pass</span>')
    // a still picture: everyone mid-breath, eyes open, the riser already up
    document.fonts.ready.then(() => {
      draw()
      for (const a of document.getAnimations()) { const t = a.effect?.getTiming?.(); if (t && t.iterations !== Infinity) a.finish(); else { a.pause(); a.currentTime = a.animationName === 'av-wiggle-soft' ? 400 : 0 } }
    })
  </script>
</body>
</html>
