<!doctype html>
<!-- The README cover: the wordmark, one line in the brand face, and the crew in its felt room acting out what each one
     is doing (the app's own CSS, avatar.js and brand.js, with the demo crew). Rendered by `npm run shots -- cover`
     at 1280×640. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../ui/common.css">
  <style>
    html, body { width: 1280px; height: 640px; overflow: hidden; background: transparent !important; }
    .cover { position: relative; width: 1280px; height: 640px; border-radius: 44px; overflow: hidden; background: #F5F5F4; color: #1C1C1C; }
    .wm { position: absolute; left: 60px; top: 44px; }
    h1 { position: absolute; left: 64px; top: 128px; margin: 0; font: 600 60px/64px var(--font-brand); letter-spacing: -.01em; }
    h1 em { font-style: normal; color: #CC2277; }
    .lead { position: absolute; left: 66px; top: 272px; margin: 0; max-width: 620px; font-size: 21px; line-height: 30px; color: #6B6B6B; }
    .free { position: absolute; right: 64px; top: 64px; font-size: 16px; color: #6B6B6B; }
    .room { position: absolute; left: 64px; right: 64px; top: 362px; height: 216px; }
    .room-felt { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; }
    .room-felt > span { position: absolute; left: 0; right: 0; }
    .crew { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: space-around; align-items: flex-end; padding: 0 16px; }
    .crew > span { line-height: 0; }
    .names { position: absolute; left: 64px; right: 64px; top: 590px; display: flex; justify-content: space-around; padding: 0 16px; }
    .names span { width: 120px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 500 17px/22px var(--font-brand); color: #6B6B6B; }
    .names .dot { width: 9px; height: 9px; }
    .bubble-say { position: absolute; z-index: 3; padding: 9px 14px; border-radius: 12px; border-bottom-left-radius: 4px; background: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); font-size: 16px; line-height: 22px; white-space: nowrap; }
    .bubble-say code { font: 15px var(--mono); }
  </style>
</head>
<body>
  <div class="cover">
    <span class="wm" id="wm"></span>
    <span class="free">Free. Bring your own Claude or Codex account.</span>
    <h1>Your AI agents,<br>working as a <em>crew</em></h1>
    <p class="lead">Claude Code and Codex agents with names, jobs and one chat for all of them. They split the work, and ask when they need you.</p>
    <div class="room" id="room"></div>
    <div class="names" id="names"></div>
  </div>
  <script src="../ui/avatar.js"></script>
  <script src="../ui/common.js"></script>
  <script src="../ui/brand.js"></script>
  <script>
    // the demo crew (screenshot-preload.cjs), each in the pose its status gives it
    const crew = [
      ['Ada', 'working', { body: 'blob', color: 'mint', eyes: 'dot', mouth: 'none', hat: 'glasses', cheeks: false }],
      ['Milo', 'waiting', { body: 'cat', color: 'sky', eyes: 'happy', mouth: 'cat', hat: 'party', cheeks: true }, 'permission'],
      ['Iris', 'waiting', { body: 'heart', color: 'pink', eyes: 'sparkle', mouth: 'smile', hat: 'flower', cheeks: true }, 'question'],
      ['Theo', 'working', { body: 'frog', color: 'lime', eyes: 'googly', mouth: 'grin', hat: 'none', cheeks: false }],
      ['June', 'idle', { body: 'bunny', color: 'peach', eyes: 'happy', mouth: 'smile', hat: 'bow', cheeks: true }],
      ['Rex', 'starting', { body: 'mochi', color: 'yellow', eyes: 'dot', mouth: 'smile', hat: 'headphones', cheeks: true }],
      ['Noor', 'off', { body: 'drop', color: 'purple', eyes: 'googly', mouth: 'cat', hat: 'beret', cheeks: false }],
    ].map(([name, status, avatar, ask]) => ({ name, status, avatar, ask, on: status !== 'off' }))
    document.getElementById('wm').innerHTML = wordmarkHTML(64)
    document.getElementById('room').innerHTML = `${roomFeltHTML(58)}<div class="crew">${crew.map((a) => `<span>${avatarHTML(a, { size: 120, pose: poseOf(a, { ask: a.ask }) })}</span>`).join('')}</div>`
    document.getElementById('names').innerHTML = crew.map((a) => `<span>${a.status === 'working' || a.status === 'waiting' ? `<i class="dot ${a.status === 'waiting' ? 'needs' : 'working'}"></i>` : ''}${a.name}</span>`).join('')
    // two of them talking: Milo asks, Theo reports
    const room = document.getElementById('room')
    room.insertAdjacentHTML('beforeend', '<span class="bubble-say" style="left:236px;top:16px">Can I run <code>npm run build</code>?</span><span class="bubble-say" style="left:575px;top:26px">All 48 checkout tests pass</span>')
    // a still picture: everyone mid-breath, eyes open, the riser already up
    document.fonts.ready.then(() => {
      document.getElementById('wm').innerHTML = wordmarkHTML(64)
      for (const a of document.getAnimations()) { const t = a.effect?.getTiming?.(); if (t && t.iterations !== Infinity) a.finish(); else { a.pause(); a.currentTime = a.animationName === 'av-wiggle-soft' ? 400 : 0 } }
    })
  </script>
</body>
</html>
